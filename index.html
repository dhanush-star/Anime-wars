<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Alliance — Prototype</title>
<style>
:root {
  --bg: #14151a;
  --bg-panel: #1c1e26;
  --bg-panel-2: #23252f;
  --ink: #e9e9ef;
  --ink-dim: #9a9caa;
  --line: #34363f;
  --accent: #e0b13c;
  --danger: #e0553c;
  --good: #4cc38a;
  --font-display: 'Rubik', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
}

body {
  background-image:
    radial-gradient(circle at 15% 10%, rgba(224,177,60,0.06), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(90,176,245,0.06), transparent 40%);
}

#app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 16px 60px;
}

h1, h2, h3 { font-family: var(--font-display); margin: 0 0 8px; letter-spacing: 0.2px; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  margin-bottom: 16px;
}

.topbar .title { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.topbar .subtitle { color: var(--ink-dim); font-size: 13px; margin-top: 2px; }

.btn {
  display: inline-block;
  background: var(--bg-panel-2);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 9px 16px;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 14px;
  cursor: pointer;
  transition: border-color .15s, transform .05s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #1a1500; border-color: var(--accent); font-weight: 600; }
.btn-primary:hover { border-color: #fff; }
.btn-danger { background: var(--danger); color: #2a0a03; border-color: var(--danger); font-weight: 600; }
.btn-block { display:block; width:100%; text-align:center; }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
}

.player-panel {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}
.player-panel.is-active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.player-panel.is-eliminated { opacity: 0.45; }

.player-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.player-name { font-weight: 700; font-family: var(--font-display); font-size: 16px; }
.player-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--bg-panel-2);
  color: var(--ink-dim);
  border: 1px solid var(--line);
}
.player-badge.turn { background: var(--accent); color: #1a1500; border-color: var(--accent); }
.bank {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--accent); font-weight: 600;
}
.coinpile { display:flex; align-items:center; gap:4px; }
.coin-chip {
  width: 20px; height: 20px; border-radius: 50%;
  background: linear-gradient(160deg,#f3d16c,#b8871f);
  border: 1px solid #7a5a10;
  font-size: 10px; color:#3a2a02; display:flex; align-items:center; justify-content:center; font-weight:700;
}

.team-strength {
  font-size: 12.5px; color: var(--ink-dim); margin-bottom: 8px;
  padding: 6px 10px; background: var(--bg-panel-2); border-radius: 8px; display: inline-block;
}
.team-strength b { color: var(--accent); font-family: var(--font-display); }

.floor { display: flex; gap: 8px; flex-wrap: wrap; }

.card {
  width: 118px;
  border-radius: 10px;
  padding: 8px;
  position: relative;
  border: 2px solid var(--line);
  background: var(--bg-panel-2);
  font-size: 11px;
  cursor: default;
  user-select: none;
}
.card.selectable { cursor: pointer; transition: transform .1s; }
.card.selectable:hover { transform: translateY(-3px); }
.card-view-btn {
  position: absolute; top: 4px; left: 4px; z-index: 3;
  width: 20px; height: 20px; border-radius: 50%; border: none;
  background: rgba(0,0,0,0.55); color: #fff; font-size: 11px; line-height: 20px;
  padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.card-view-btn:hover { background: rgba(0,0,0,0.8); }
.card.selected { outline: 3px solid var(--good); outline-offset: 1px; }
.card .rarity-tag {
  position: absolute; top: 6px; right: 6px;
  font-size: 8px; padding: 1px 5px; border-radius: 6px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
  z-index: 2;
}
.card-img-wrap {
  width: 100%; aspect-ratio: 1 / 1; border-radius: 7px; overflow: hidden;
  background: rgba(0,0,0,0.25); margin-bottom: 6px; position: relative;
}
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-img-fallback {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 26px; color: rgba(255,255,255,0.35);
}
.card.big .card-img-wrap { margin-bottom: 8px; }
.card.big .card-img-fallback { font-size: 40px; }
.card .cname { font-family: var(--font-display); font-weight: 700; font-size: 12.5px; line-height: 1.15; margin: 4px 0 3px; min-height: 30px; }
.card .cseries { color: var(--ink-dim); font-size: 9.5px; margin-bottom: 6px; }
.card .powerline {
  font-family: var(--font-display); font-weight: 700; font-size: 9.5px;
  color: var(--accent); margin: 0 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card.big .powerline { font-size: 13px; margin-bottom: 8px; }

/* --- History tab --- */
.history-toggle {
  position: fixed; right: 14px; bottom: 14px; z-index: 55;
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
  padding: 10px 16px; border-radius: 999px; cursor: pointer;
  background: var(--bg-panel-2); color: var(--ink);
  border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,0.45);
}
.history-toggle:hover { border-color: var(--accent); color: var(--accent); }
.history-panel {
  position: fixed; right: 14px; bottom: 62px; z-index: 56;
  width: min(460px, calc(100vw - 28px)); max-height: 62vh;
  display: flex; flex-direction: column;
  background: var(--bg-panel); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 16px 44px rgba(0,0,0,0.6); overflow: hidden;
}
.history-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--bg-panel-2);
}
.history-legend {
  display: flex; gap: 5px; flex-wrap: wrap;
  padding: 8px 12px; border-bottom: 1px solid var(--line);
}
.history-body { overflow-y: auto; padding: 6px 10px 12px; }
.hist-item {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 7px 8px; border-radius: 8px; margin-top: 5px;
  font-size: 12.5px; line-height: 1.45;
  border-left: 3px solid var(--line); background: rgba(255,255,255,0.03);
}
.hist-msg { flex: 1; color: var(--ink); }
.hist-tag {
  flex: 0 0 auto; font-family: var(--font-display); font-weight: 700;
  font-size: 9px; letter-spacing: 0.4px; padding: 2px 6px; border-radius: 5px;
  border: 1px solid currentColor; white-space: nowrap;
}
.hist-item.h-ai       { border-left-color: #8b7bd8; background: rgba(139,123,216,0.10); }
.h-ai      { color: #a99bf0; }
.hist-item.h-auction  { border-left-color: #e0b13c; background: rgba(224,177,60,0.10); }
.h-auction { color: #e0b13c; }
.hist-item.h-wild     { border-left-color: #e86a9b; background: rgba(232,106,155,0.10); }
.h-wild    { color: #e86a9b; }
.hist-item.h-combat   { border-left-color: #ff6b5a; background: rgba(255,107,90,0.10); }
.h-combat  { color: #ff8a7a; }
.hist-item.h-set      { border-left-color: #4fd6a0; background: rgba(79,214,160,0.10); }
.h-set     { color: #4fd6a0; }
.hist-item.h-phase    { border-left-color: #5ab0f5; background: rgba(90,176,245,0.10); }
.h-phase   { color: #5ab0f5; }
.hist-item.h-draw     { border-left-color: #7f8aa3; background: rgba(127,138,163,0.08); }
.h-draw    { color: #9aa5bd; }
.hist-item.h-none     { border-left-color: var(--line); }
.h-none    { color: var(--ink-dim); }

/* --- Combat meters (Mana / Ultimate) --- */
.meter-block {
  width: 150px; margin-top: 8px; padding: 8px 9px;
  background: rgba(0,0,0,0.30); border: 1px solid var(--line); border-radius: 10px;
}
.meter-row { display: flex; justify-content: space-between; align-items: baseline; }
.meter-label { font-family: var(--font-display); font-weight: 700; font-size: 9.5px; letter-spacing: 0.5px; color: #5ab0f5; }
.meter-val { font-family: var(--font-display); font-weight: 700; font-size: 11px; }
.meter-bar {
  position: relative; height: 9px; border-radius: 999px; margin-top: 3px;
  background: rgba(255,255,255,0.10); overflow: hidden;
}
.meter-fill { height: 100%; border-radius: 999px; transition: width 0.35s ease; }
.meter-bar.ult-ready { box-shadow: 0 0 12px rgba(255,211,77,0.9); }
.meter-marker {
  position: absolute; top: -2px; width: 2px; height: 13px;
  background: #fff; opacity: 0.85; border-radius: 1px;
}
.meter-sub { font-size: 9px; color: var(--ink-dim); margin-top: 3px; text-align: left; }

/* --- Structured auction --- */
.auction-steps { display: flex; gap: 8px; align-items: center; justify-content: center; margin-bottom: 12px; }
.astep {
  font-family: var(--font-display); font-weight: 700; font-size: 10.5px;
  padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-dim);
}
.astep.on { border-color: var(--accent); color: var(--accent); background: rgba(224,177,60,0.12); }
.astep.done { opacity: 0.55; }
.astep-sep { color: var(--ink-dim); font-size: 12px; }
.auction-turn {
  text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 15px;
  padding: 10px; margin: 10px 0; border-radius: 10px;
  background: rgba(224,177,60,0.12); border: 1px solid var(--accent); color: var(--accent);
}
.auction-turn.ai { background: rgba(139,123,216,0.12); border-color: #8b7bd8; color: #a99bf0; }
.bid-order { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.bid-seat {
  display: flex; align-items: center; gap: 8px; font-size: 12.5px;
  padding: 6px 10px; border-radius: 8px; background: var(--bg-panel-2);
  border-left: 3px solid transparent;
}
.bid-seat .seat-num {
  font-family: var(--font-display); font-weight: 700; font-size: 10px;
  width: 18px; height: 18px; border-radius: 50%; display: inline-flex;
  align-items: center; justify-content: center; background: var(--line); color: var(--ink);
}
.bid-seat.now { border-left-color: var(--accent); background: rgba(224,177,60,0.10); }
.bid-seat.high { border-left-color: #4fd6a0; }
.bid-seat.out { opacity: 0.45; text-decoration: line-through; }

/* --- Concealed opponent card --- */
.card.concealed .stats,
.card.concealed .movelist,
.card.concealed .powerline { filter: blur(5px); opacity: 0.45; user-select: none; }
.conceal-note {
  font-size: 10px; color: var(--ink-dim); margin-top: 6px;
  text-align: center; font-style: italic;
}

/* --- Signature move list on the big card --- */
.movelist { margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.10); padding-top: 6px; text-align: left; }
.move-row { font-size: 10.5px; color: var(--ink); line-height: 1.5; display: flex; gap: 5px; align-items: baseline; }
.move-row .move-ico { font-size: 9.5px; flex: 0 0 auto; }
.move-row.muted { color: var(--ink-dim); font-style: italic; }
.move-row.legend { color: var(--accent); font-weight: 700; }

/* --- Move buttons in the duel --- */
.move-btn { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.25; }
.move-btn small { font-size: 9.5px; opacity: 0.75; font-weight: 400; }
.legendary-btn:not(:disabled) {
  border-color: var(--accent); color: var(--accent);
  animation: ultReady 1.4s ease-in-out infinite;
}
@keyframes ultReady {
  0%, 100% { box-shadow: 0 0 0 rgba(224,177,60,0); }
  50% { box-shadow: 0 0 14px rgba(224,177,60,0.65); }
}

/* --- Attack effects --- */
@keyframes hitShake {
  0% { transform: translate(0,0); }
  15% { transform: translate(-7px, 3px) rotate(-1.5deg); }
  30% { transform: translate(6px, -3px) rotate(1.5deg); }
  45% { transform: translate(-5px, 2px) rotate(-1deg); }
  60% { transform: translate(4px, -2px) rotate(1deg); }
  80% { transform: translate(-2px, 1px); }
  100% { transform: translate(0,0); }
}
.fx-hit { animation: hitShake 0.5s ease-out; }
@keyframes attackLunge {
  0% { transform: translateX(0) scale(1); }
  35% { transform: translateX(var(--lunge, 26px)) scale(1.06); }
  100% { transform: translateX(0) scale(1); }
}
.fx-attack { animation: attackLunge 0.5s ease-out; }
@keyframes flashPulse { 0% { opacity: 0.85; } 100% { opacity: 0; } }
.fx-flash {
  position: absolute; inset: 0; border-radius: 12px; pointer-events: none;
  animation: flashPulse 0.5s ease-out forwards; z-index: 4;
}
.fx-flash.basic { background: radial-gradient(circle, rgba(255,255,255,0.75), transparent 70%); }
.fx-flash.special { background: radial-gradient(circle, rgba(255,110,60,0.85), transparent 70%); }
.fx-flash.legendary { background: radial-gradient(circle, rgba(224,177,60,0.95), transparent 72%); }
.fx-flash.block { background: radial-gradient(circle, rgba(90,176,245,0.75), transparent 70%); }

@keyframes slashSweep {
  0% { transform: translate(-120%, 120%) rotate(-38deg); opacity: 0; }
  25% { opacity: 1; }
  100% { transform: translate(120%, -120%) rotate(-38deg); opacity: 0; }
}
.fx-slash {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; overflow: hidden; z-index: 5; border-radius: 12px;
}
.fx-slash::after {
  content: ''; position: absolute; top: 0; left: 0; width: 60%; height: 220%;
  background: linear-gradient(90deg, transparent, #fff, transparent);
  animation: slashSweep 0.5s ease-out forwards;
}

@keyframes dmgFloat {
  0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
  20% { transform: translate(-50%, -14px) scale(1.15); opacity: 1; }
  100% { transform: translate(-50%, -62px) scale(1); opacity: 0; }
}
.fx-damage {
  position: absolute; top: 38%; left: 50%; z-index: 6; pointer-events: none;
  font-family: var(--font-display); font-weight: 800; font-size: 30px;
  color: #ff5a5a; text-shadow: 0 2px 0 #2a0000, 0 0 16px rgba(255,60,60,0.85);
  animation: dmgFloat 1.05s ease-out forwards; white-space: nowrap;
}
.fx-damage.crit { color: #ffd34d; font-size: 38px; text-shadow: 0 2px 0 #3a2400, 0 0 20px rgba(255,200,60,0.95); }
.fx-damage.heal { color: #6ee7a8; }
.duel-fighter { position: relative; }

.fx-banner {
  position: fixed; top: 34%; left: 50%; transform: translateX(-50%);
  z-index: 60; pointer-events: none; text-align: center;
  font-family: var(--font-display); font-weight: 800;
  font-size: 26px; letter-spacing: 0.5px; padding: 12px 26px; border-radius: 14px;
  background: rgba(10,10,18,0.88); border: 2px solid var(--accent); color: var(--accent);
  text-shadow: 0 0 18px rgba(224,177,60,0.8);
  animation: bannerIn 1.25s ease-out forwards;
}
@keyframes bannerIn {
  0% { opacity: 0; transform: translateX(-50%) scale(0.75); }
  18% { opacity: 1; transform: translateX(-50%) scale(1.05); }
  75% { opacity: 1; transform: translateX(-50%) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) scale(1); }
}
.card .stats { display: flex; gap: 3px; font-size: 8.5px; }
.card .stat { flex:1; text-align:center; background: rgba(255,255,255,0.03); border-radius: 5px; padding: 3px 0; min-width: 0; }
.card .stat b { display:block; font-size: 10px; }
.card.big .stats { gap: 6px; font-size: 10px; }
.card.big .stats .stat b { font-size: 15px; }
.card .hpbar-wrap { margin-top: 6px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.card .hpbar { height: 100%; background: var(--good); }
.card.dead { opacity: 0.3; filter: grayscale(1); }
.card.big { width: 190px; padding: 14px; font-size: 13px; }
.card.big .cname { font-size: 16px; min-height: auto; }

.card.empty-slot {
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-dim); border-style: dashed; font-size: 10px;
}

.modal-overlay {
  position: fixed; inset: 0; background: rgba(8,8,10,0.72);
  display: flex; align-items: center; justify-content: center;
  z-index: 50; padding: 16px;
}
.modal {
  background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px; max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto;
}
.modal h2 { margin-bottom: 4px; }
.modal .desc { color: var(--ink-dim); font-size: 13.5px; margin-bottom: 14px; }

.log-panel {
  background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; max-height: 160px; overflow-y: auto; font-size: 12.5px; color: var(--ink-dim);
}
.log-panel div { padding: 2px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }

.privacy-wrap {
  text-align: center; padding: 60px 20px;
}
.privacy-wrap .eye { font-size: 42px; margin-bottom: 10px; }

.notif {
  position: fixed; top: 14px; right: 14px; z-index: 80;
  display: flex; flex-direction: column; gap: 8px; max-width: 320px;
}
.notif-item {
  background: var(--accent); color: #1a1500; padding: 10px 14px; border-radius: 8px;
  font-size: 13px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  animation: slidein .2s ease-out;
}
@keyframes slidein { from { opacity:0; transform: translateX(20px);} to {opacity:1; transform:none;} }

/* ====== PER-TIER CARD DRAW / REVEAL ANIMATIONS ====== */
.reveal-stage {
  position: relative;
  display: inline-block;
  isolation: isolate;
}
.reveal-overlay {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(6,6,8,0.78);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; cursor: pointer; padding: 16px;
}
.reveal-overlay .reveal-hint {
  color: var(--ink-dim); font-size: 12.5px; letter-spacing: .3px;
  animation: revealHintPulse 1.4s ease-in-out infinite;
}
@keyframes revealHintPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.reveal-stage .card.big { position: relative; z-index: 2; overflow: hidden; }
.reveal-burst {
  position: absolute; inset: -34px;
  z-index: 1; border-radius: 20px;
  pointer-events: none; opacity: 0;
}

/* Common — a quick, no-fuss fade-up. Nothing to see here, keep drafting. */
.reveal-common .card.big { animation: revealPopCommon .4s ease-out; }
@keyframes revealPopCommon {
  from { opacity: 0; transform: translateY(8px) scale(.96); }
  to   { opacity: 1; transform: none; }
}

/* Rare — a cool blue shimmer sweep with a gentle scale-and-settle */
.reveal-rare .card.big { animation: revealPopRare .6s cubic-bezier(.22,.85,.3,1); }
@keyframes revealPopRare {
  0%   { opacity: 0; transform: scale(.85) rotate(-2deg); filter: brightness(1); }
  55%  { opacity: 1; transform: scale(1.05) rotate(.5deg); filter: brightness(1.35); }
  100% { opacity: 1; transform: scale(1) rotate(0); filter: brightness(1); }
}
.reveal-rare .reveal-burst {
  background: radial-gradient(circle, rgba(90,176,245,0.55), transparent 65%);
  animation: revealBurstRare .6s ease-out;
}
@keyframes revealBurstRare { from { opacity: 1; transform: scale(.4);} to { opacity: 0; transform: scale(1.3);} }

/* Epic — punchier purple flash with a little spin-settle */
.reveal-epic .card.big { animation: revealPopEpic .8s cubic-bezier(.22,.9,.25,1.2); }
@keyframes revealPopEpic {
  0%   { opacity: 0; transform: scale(.6) rotate(-10deg); }
  60%  { opacity: 1; transform: scale(1.13) rotate(4deg); filter: brightness(1.5) saturate(1.2); }
  100% { opacity: 1; transform: scale(1) rotate(0); filter: brightness(1) saturate(1); }
}
.reveal-epic .reveal-burst {
  background: radial-gradient(circle, rgba(180,122,240,0.65), transparent 60%);
  animation: revealBurstEpic .8s ease-out;
}
@keyframes revealBurstEpic { 0% { opacity: 1; transform: scale(.3);} 100% { opacity: 0; transform: scale(1.6);} }

/* Legendary — the big one: golden shockwave, shimmer sweep, and a bounce-in */
.reveal-legendary .card.big { animation: revealPopLegendary 1.15s cubic-bezier(.22,1,.36,1); }
@keyframes revealPopLegendary {
  0%   { opacity: 0; transform: scale(.4) rotate(-14deg); }
  45%  { opacity: 1; transform: scale(1.2) rotate(6deg); filter: brightness(1.7) saturate(1.3); }
  70%  { transform: scale(0.96) rotate(-2deg); filter: brightness(1.1); }
  100% { opacity: 1; transform: scale(1) rotate(0); filter: brightness(1) saturate(1); }
}
.reveal-legendary .card.big::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.65) 48%, transparent 66%);
  background-size: 250% 250%;
  animation: revealShimmer 1.15s ease-out;
  pointer-events: none;
}
@keyframes revealShimmer { 0% { background-position: 140% 0; opacity: 1;} 100% { background-position: -40% 0; opacity: 0;} }
.reveal-legendary .reveal-burst {
  background: radial-gradient(circle, rgba(224,177,60,0.85), rgba(224,177,60,0.15) 45%, transparent 70%);
  animation: revealBurstLegendary 1.15s ease-out;
}
@keyframes revealBurstLegendary { 0% { opacity: 1; transform: scale(.2);} 60% { opacity: .8; transform: scale(1.3);} 100% { opacity: 0; transform: scale(1.9);} }

.bracket { display: flex; gap: 26px; overflow-x: auto; padding: 10px 0; }
.bracket-round { display: flex; flex-direction: column; gap: 18px; justify-content: center; min-width: 180px; }
.bracket-round h4 { color: var(--ink-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.bracket-match { background: var(--bg-panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.bracket-match .vs { color: var(--ink-dim); font-size: 10px; margin: 2px 0; }
.bracket-match .winner { color: var(--good); font-weight: 700; }

.center-col { display:flex; flex-direction:column; align-items:center; gap: 14px; text-align:center; }

.duel-arena { display:flex; align-items:center; justify-content:center; gap: 30px; margin: 18px 0; }
.duel-vs { font-family: var(--font-display); font-size: 22px; color: var(--ink-dim); }

.helpicon { color: var(--ink-dim); font-size: 12px; cursor: pointer; text-decoration: underline dotted; }

.tag-pill {
  display:inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px;
  background: var(--bg-panel-2); border: 1px solid var(--line); margin: 2px 3px 2px 0; color: var(--ink-dim);
}

@media (max-width: 640px) {
  .card { width: 96px; }
  .duel-arena { flex-direction: column; }
}

<script>
// ====== UTILITIES ======

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randInt(min, max) { // inclusive
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// HP is derived from a character's fixed Power + Defense — bulkier, better-defended
// characters can soak up more hits. (Power carries most of the weight since it's the
// closest thing to an overall "how strong is this character" number in the card data.)
function deriveMaxHp(c) {
  return Math.round(1000 + c.power * 2 + c.defense * 1.5);
}

// Power Level (0-1000) is a big, dramatic headline number derived from a character's
// own sub-stats, so two characters of the same rarity still land at different numbers
// based on their own profile — a glass-cannon reads differently from a tank even inside
// the same tier. Speed and IQ are now real stats straight off the character sheet (see
// drawCharacterCard) rather than derived, per the combat spec.
function computeDerivedStats(c) {
  c.powerLevel = Math.round(c.power * 0.4 + c.attack * 0.25 + c.specialAttack * 0.2 + c.defense * 0.15);
}

// Total Team Strength — sum of every character's Power Level on a player's floor.
// Shown at the top of each floor so a team's overall muscle is visible at a glance.
function teamStrength(floor) {
  return floor.reduce((sum, c) => sum + (c.powerLevel || 0), 0);
}

let _uid = 1;
function nextUid() { return _uid++; }

// ====== GAME STATE FACTORY ======

function createGame(playerNames, aiFlags) {
  const characterDeck = shuffle(CHARACTERS_RAW.map(c => ({ ...c })));
  const coinWildcardDeck = shuffle(buildCoinWildcardDeckSpec());

  const players = playerNames.map((name, i) => ({
    id: i,
    name,
    isAI: !!(aiFlags && aiFlags[i]),
    bank: 7,
    coinPile: [],          // {value} cards, face-down except top
    floor: [],             // drafted character instances
    heldWildcards: [],     // [{uid, type}]
    usedSteal: false,
    doubleBidArmed: false,
    eliminated: false
  }));

  return {
    screen: 'setup',
    players,
    characterDeck,
    coinWildcardDeck,
    discardPile: [],        // characters discarded during down-to-5 step
    currentPlayerIndex: 0,
    log: [],
    // transient UI/modal state
    modal: null,            // {type: 'wildcardChoice'|'auction'|'shop'|'swap'|'steal'|'privacy', ...}
    pendingDraw: null,      // the character/coin-or-wild just drawn this turn, for display
    discardQueue: [],       // player ids that still need to discard down to 10
    bracket: null,          // attack-phase bracket state
    notifications: [],      // transient banner messages (set bonuses etc.)
    history: [],            // full game history (every event, including all AI moves)
    historyOpen: false,
    _aiActing: false        // true while the AI engine is performing an action
  };
}

// Every game event lands in the history tab. `kind` drives the colour coding there:
// 'ai' (robot moves), 'auction', 'wild', 'combat', 'set', 'phase', or '' for neutral.
function logHistory(G, msg, kind) {
  if (!G) return;
  G.history.unshift({ msg, kind: kind || '', ai: !!G._aiActing, round: G.round || 0 });
  if (G.history.length > 400) G.history.pop();
}

// notify() records to history always, but only raises an on-screen toast when a HUMAN
// is the one acting. AI/robot moves stay quiet and are reviewable in the history tab,
// so the screen isn't flooded with narration of moves the player didn't make.
function notify(G, msg, kind) {
  logHistory(G, msg, kind);
  if (!G._aiActing) G.notifications.push(msg);
}

// For messages that should always surface, even mid-AI-turn (errors, phase changes).
function notifyAlways(G, msg, kind) {
  logHistory(G, msg, kind);
  G.notifications.push(msg);
}

function activePlayer(G) { return G.players[G.currentPlayerIndex]; }

function drawCharacterCard(G) {
  if (G.characterDeck.length === 0) {
    // reshuffle discard pile back in as a fallback (shouldn't normally happen)
    if (G.discardPile.length > 0) {
      G.characterDeck = shuffle(G.discardPile);
      G.discardPile = [];
    } else {
      return null;
    }
  }
  const raw = G.characterDeck.pop();
  const card = {
    uid: nextUid(),
    id: raw.id,
    name: raw.name,
    series: raw.series,
    rarity: raw.rarity,
    // fixed identity stats straight from the character stat sheet
    basePower: raw.power,
    baseAttack: raw.attack,
    baseSpecialAttack: raw.specialAttack,
    baseDefense: raw.defense,
    baseMana: raw.mana,
    baseSpeed: raw.speed,
    baseIq: raw.iq,
    power: raw.power,
    attack: raw.attack,
    specialAttack: raw.specialAttack,
    defense: raw.defense,
    mana: raw.mana,
    speed: raw.speed,
    iq: raw.iq,
    usedSpecial: false,
    bonuses: [] // labels of set bonuses applied
  };
  card.maxHp = deriveMaxHp(card);
  card.hp = card.maxHp;
  computeDerivedStats(card);
  return card;
}

function drawCoinWildcardCard(G) {
  if (G.coinWildcardDeck.length === 0) {
    G.coinWildcardDeck = shuffle(buildCoinWildcardDeckSpec());
  }
  return G.coinWildcardDeck.pop();
}

function lowestRarityCharacter(floor) {
  if (floor.length === 0) return null;
  let best = floor[0];
  let bestRank = RARITY_ORDER.indexOf(best.rarity);
  for (const c of floor) {
    const rank = RARITY_ORDER.indexOf(c.rarity);
    if (rank < bestRank) { best = c; bestRank = rank; }
  }
  return best;
}

function removeCharFromFloor(player, uid) {
  const idx = player.floor.findIndex(c => c.uid === uid);
  if (idx === -1) return null;
  return player.floor.splice(idx, 1)[0];
}

// ====== SET / COMBO BONUSES ======
// Applied once, when a team is locked in going into the Attack Phase.
function applySetBonuses(G, player) {
  const applied = [];
  // reset any prior bonus markers (idempotent if called once, but safe)
  player.floor.forEach(c => {
    c.power = c.basePower;
    c.attack = c.baseAttack;
    c.specialAttack = c.baseSpecialAttack;
    c.defense = c.baseDefense;
    c.mana = c.baseMana;
    c.speed = c.baseSpeed;
    c.iq = c.baseIq;
    c.bonuses = [];
  });

  // Series Set: >=3 cards of same series -> +2 Attack and +2 Defense to those cards
  const bySeries = {};
  player.floor.forEach(c => { (bySeries[c.series] = bySeries[c.series] || []).push(c); });
  Object.entries(bySeries).forEach(([series, cards]) => {
    if (cards.length >= 3) {
      cards.forEach(c => { c.attack += 2; c.defense += 2; c.bonuses.push(`Series Set (${series}) +2 ATK/DEF`); });
      applied.push(`${player.name}: Series Set — ${series} (+2 Attack/Defense to ${cards.length} cards)`);
    }
  });

  // Rarity Set: >=3 cards of same rarity -> +4 Power and +3 Special Attack to those cards.
  // For Commons (Special Attack always starts at 0) this can be enough to unlock their
  // Special Move for the very first time — a small reward for running a full common squad.
  const byRarity = {};
  player.floor.forEach(c => { (byRarity[c.rarity] = byRarity[c.rarity] || []).push(c); });
  Object.entries(byRarity).forEach(([rarity, cards]) => {
    if (cards.length >= 3) {
      cards.forEach(c => { c.power += 4; c.specialAttack += 3; c.bonuses.push(`Rarity Set (${rarity}) +4 PWR/+3 SPA`); });
      applied.push(`${player.name}: Rarity Set — ${rarity} (+4 Power/+3 Special Attack to ${cards.length} cards)`);
    }
  });

  // HP is derived from Power + Defense, so recompute it after bonuses are applied.
  // Power Level and Speed are recomputed too, since they're derived from the same sub-stats.
  player.floor.forEach(c => {
    computeDerivedStats(c);
    c.maxHp = deriveMaxHp(c);
    c.hp = c.maxHp;
  });

  return applied;
}

// ====== BRACKET ENGINE ======
// Builds a simple single-elimination bracket supporting 2-8 players, with byes for odd counts.
function buildBracket(players) {
  const order = shuffle(players.map(p => p.id));
  return {
    round: 1,
    remaining: order,     // player ids still alive going into current round's pairing
    currentMatches: pairUp(order),
    matchIndex: 0,
    finished: false,
    winnerId: null,
    matchLog: []
  };
}

function pairUp(ids) {
  const matches = [];
  const q = ids.slice();
  while (q.length > 0) {
    const p1 = q.shift();
    const p2 = q.length > 0 ? q.shift() : null; // null = bye
    matches.push({ p1, p2, winner: p2 === null ? p1 : null });
  }
  return matches;
}

function currentMatch(bracket) {
  return bracket.currentMatches[bracket.matchIndex] || null;
}

function advanceBracketAfterMatch(bracket, winnerId) {
  const m = currentMatch(bracket);
  m.winner = winnerId;
  bracket.matchIndex++;
  if (bracket.matchIndex >= bracket.currentMatches.length) {
    // round complete; gather winners
    const winners = bracket.currentMatches.map(m => m.winner);
    if (winners.length === 1) {
      bracket.finished = true;
      bracket.winnerId = winners[0];
      return;
    }
    bracket.round++;
    bracket.currentMatches = pairUp(winners);
    bracket.matchIndex = 0;
  }
}

// ====== COMBAT ENGINE ======
// A "matchup" pits two full teams against each other, relay-style.
function createMatchup(playerA, playerB) {
  return {
    playerAId: playerA.id,
    playerBId: playerB.id,
    poolA: playerA.floor.map(c => ({ ...c, hp: c.maxHp, usedSpecial: false })),
    poolB: playerB.floor.map(c => ({ ...c, hp: c.maxHp, usedSpecial: false })),
    activeA: null,
    activeB: null,
    log: [],
    winnerId: null,
    phase: 'pick-initial' // pick-initial -> reveal -> dueling -> pick-relay -> done
  };
}

const BASIC_BY_SERIES = {"One Piece": "Pirate Strike", "Naruto": "Shinobi Strike", "Demon Slayer": "Blade Strike", "My Hero Academia": "Quirk Strike", "Jujutsu Kaisen": "Cursed Strike", "Black Clover": "Magic Strike"};

function specialMoveName(c) { return SPECIAL_MOVES[c.name] || 'Special Attack'; }
function legendaryMoveName(c) { return LEGENDARY_MOVES[c.name] || 'Ultimate Attack'; }
function basicMoveName(c) { return BASIC_BY_SERIES[c.series] || 'Basic Attack'; }

const SPECIAL_MANA_COST = { Rare: 25, Epic: 32, Legendary: 40 };
const LEGENDARY_MANA_COST = 60;

function clampNum(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// A character can only ever throw a Special Move if their Special Attack stat is above 0
// (Commons always sit at Special Attack 0, per the rarity attack structure) — and, once a
// duel is underway, only if they can afford the Mana Pool cost for their rarity.
function canUseSpecial(fighter) {
  return fighter.specialAttack > 0;
}

// Resets a fighter's per-duel combat resources (Mana Pool, Ultimate Energy, status
// effects) fresh whenever they step in as a new active fighter — called from pickActive.
function initFighterCombatState(c) {
  c.manaPool = 50;
  c.ultimateEnergy = 0;
  c.burnTurns = 0;
  c.bleedTurns = 0;
  c.poisonTurns = 0;
  c.stunned = false;
  c.frozen = false;
  c.defenseBreakTurns = 0;
  c.attackBoostTurns = 0;
  c.blockActive = false;
  c._hasActed = false;
}

function effAttack(f) { return f.attackBoostTurns > 0 ? f.attack * 1.15 : f.attack; }
function effDefense(f) { return f.defenseBreakTurns > 0 ? f.defense * 0.80 : f.defense; }

function powerGapRatio(attacker, defender) {
  return clampNum(attacker.power / Math.max(1, defender.power), 0.75, 1.25);
}
function tacticalBonus(attacker, defender) {
  return clampNum((attacker.iq - defender.iq) / 1000 * 0.10, -0.10, 0.10);
}

function basicAttackDamage(attacker, defender) {
  const raw = effAttack(attacker) * 0.70 + attacker.power * 0.30;
  const defRed = effDefense(defender) / (effDefense(defender) + 500);
  let dmg = raw * (1 - defRed);
  dmg *= powerGapRatio(attacker, defender);
  dmg *= (1 + tacticalBonus(attacker, defender));
  return Math.max(1, dmg);
}
function basicCritChance(attacker) { return clampNum(5 + attacker.speed * 0.005 + attacker.iq * 0.005, 0, 25); }

function specialAttackDamage(attacker, defender) {
  const specialPower = attacker.specialAttack * 0.60 + attacker.power * 0.20 + attacker.mana * 0.20;
  let dmg = specialPower - effDefense(defender) * 0.35;
  dmg = Math.max(5, dmg);
  dmg *= powerGapRatio(attacker, defender);
  dmg *= (1 + tacticalBonus(attacker, defender));
  return dmg;
}
function specialCritChance(attacker) { return clampNum(3 + attacker.iq * 0.003 + attacker.speed * 0.002, 0, 20); }

function counterChance(defender) { return clampNum(10 + defender.iq * 0.01, 0, 20); }

// Legendary Attack: bigger, defense-piercing, and a 3-hit combo (escalating like the
// Zenitsu/Luffy examples in the spec) rather than just one large number.
function legendaryAttackDamage(attacker, defender) {
  const pierced = effDefense(defender) * 0.75; // ignores 25% of Defense
  const specialPower = attacker.specialAttack * 0.60 + attacker.power * 0.20 + attacker.mana * 0.20;
  let base = (specialPower - pierced * 0.35) * 1.5;
  base = Math.max(10, base) * powerGapRatio(attacker, defender) * (1 + tacticalBonus(attacker, defender));
  const hitPercents = [0.70, 0.85, 1.20];
  const hits = [];
  hitPercents.forEach(pct => {
    let d = base * pct;
    const isCrit = Math.random() * 100 < specialCritChance(attacker);
    if (isCrit) d *= 1.35;
    hits.push({ dmg: Math.max(1, Math.round(d)), crit: isCrit });
  });
  return hits;
}

// Deterministic per-character flavor: which status effect (if any) an Epic/Legendary's
// Special Attack can carry. Rare specials stay a plain signature-damage hit per the
// balance philosophy; Commons have no special at all.
const STATUS_KIT = ['burn', 'bleed', 'poison', 'stun', 'freeze', 'defenseBreak', 'attackBoost'];
function specialStatusFor(c) {
  if (c.rarity !== 'Epic' && c.rarity !== 'Legendary') return null;
  return STATUS_KIT[c.id % STATUS_KIT.length];
}
function applyStatusEffect(target, type, log) {
  if (type === 'burn') { target.burnTurns = 2; log.push(`\uD83D\uDD25 ${target.name} is left burning!`); }
  else if (type === 'bleed') { target.bleedTurns = 3; log.push(`\uD83E\uDE78 ${target.name} is bleeding!`); }
  else if (type === 'poison') { target.poisonTurns = 3; log.push(`\u2620\uFE0F ${target.name} is poisoned!`); }
  else if (type === 'stun') { target.stunned = true; log.push(`\uD83D\uDCAB ${target.name} is stunned!`); }
  else if (type === 'freeze') { target.frozen = true; log.push(`\u2744\uFE0F ${target.name} is frozen — their next attack will be weaker!`); }
  else if (type === 'defenseBreak') { target.defenseBreakTurns = 2; log.push(`\uD83D\uDCA2 ${target.name}'s Defense is broken down!`); }
  else if (type === 'attackBoost') { target.attackBoostTurns = 2; log.push(`\uD83D\uDCAA ${target.name} powers up their own Attack!`); }
}

// Start-of-turn upkeep for the fighter about to act: ticks damage-over-time effects and
// duration counters, and reports whether they're stunned (loses the turn entirely).
function tickStart(fighter, log) {
  if (fighter.burnTurns > 0) {
    const d = Math.max(1, Math.round(fighter.maxHp * 0.05));
    fighter.hp = Math.max(0, fighter.hp - d);
    fighter.burnTurns--;
    log.push(`\uD83D\uDD25 ${fighter.name} takes ${d} burn damage.`);
  }
  if (fighter.hp > 0 && fighter.bleedTurns > 0) {
    const d = Math.max(1, Math.round(fighter.maxHp * 0.04));
    fighter.hp = Math.max(0, fighter.hp - d);
    fighter.bleedTurns--;
    log.push(`\uD83E\uDE78 ${fighter.name} takes ${d} bleed damage.`);
  }
  if (fighter.hp > 0 && fighter.poisonTurns > 0) {
    const d = Math.max(1, Math.round(fighter.maxHp * 0.03));
    fighter.hp = Math.max(0, fighter.hp - d);
    fighter.poisonTurns--;
    log.push(`\u2620\uFE0F ${fighter.name} takes ${d} poison damage.`);
  }
  if (fighter.defenseBreakTurns > 0) fighter.defenseBreakTurns--;
  if (fighter.attackBoostTurns > 0) fighter.attackBoostTurns--;
  if (fighter.hp <= 0) return 'dead';
  if (fighter.stunned) {
    fighter.stunned = false;
    log.push(`\uD83D\uDCAB ${fighter.name} is stunned and loses their turn!`);
    return 'stunned';
  }
  return 'ok';
}

// Resolves exactly one fighter's turn (attacker = whoever's turn it currently is) and
// advances the matchup to whatever comes next: the other side's turn, a relay pick, or
// the end of the whole 1v1 (handled by finishEncounterOrAdvance via checkMatchupState).
function resolveTurn(m, action) {
  const side = m.turn;
  const attacker = side === 'A' ? m.activeA : m.activeB;
  const defender = side === 'A' ? m.activeB : m.activeA;
  const log = m.log;

  const upkeep = tickStart(attacker, log);
  if (upkeep === 'dead') { finishEncounterOrAdvance(m); return; }
  if (upkeep === 'stunned') { advanceTurn(m); return; }

  const isFirstAction = !attacker._hasActed;
  attacker._hasActed = true;
  const firstStrike = isFirstAction && attacker.speed >= defender.speed * 1.15;

  let freezeMult = 1;
  if (attacker.frozen && action !== 'block') {
    freezeMult = 0.5;
    attacker.frozen = false;
    log.push(`\u2744\uFE0F ${attacker.name} is still thawing out — this attack is weaker.`);
  }

  let fxDmg = 0, fxCrit = false, fxCounter = 0;

  if (action === 'special' && !(canUseSpecial(attacker) && attacker.manaPool >= (SPECIAL_MANA_COST[attacker.rarity] || 25))) action = 'basic';
  if (action === 'legendary' && !(attacker.rarity === 'Legendary' && attacker.ultimateEnergy >= 100 && attacker.manaPool >= LEGENDARY_MANA_COST)) action = 'basic';

  if (action === 'block') {
    attacker.blockActive = true;
    attacker.ultimateEnergy = Math.min(100, attacker.ultimateEnergy + 5);
    log.push(`\uD83D\uDEE1\uFE0F ${attacker.name} braces to block the next hit.`);
  } else if (action === 'legendary') {
    attacker.manaPool -= LEGENDARY_MANA_COST;
    attacker.ultimateEnergy = 0;
    const hits = legendaryAttackDamage(attacker, defender);
    let total = 0;
    hits.forEach((h, i) => {
      let d = h.dmg * freezeMult * (firstStrike && i === 0 ? 1.10 : 1);
      if (defender.blockActive) d *= 0.40;
      d = Math.max(1, Math.round(d));
      defender.hp = Math.max(0, defender.hp - d);
      total += d;
      log.push(`\uD83D\uDC51 ${legendaryMoveName(attacker)} \u2014 hit ${i + 1} deals ${d}${h.crit ? ' (CRITICAL!)' : ''}!`);
      if (defender.hp <= 0) return;
    });
    defender.blockActive = false;
    defender.ultimateEnergy = Math.min(100, defender.ultimateEnergy + 6);
    fxDmg = total; fxCrit = hits.some(x => x.crit);
    log.push(`${attacker.name} unleashes \u300C${legendaryMoveName(attacker)}\u300D for ${total} total damage, piercing part of ${defender.name}'s Defense!`);
  } else if (action === 'special') {
    attacker.manaPool -= (SPECIAL_MANA_COST[attacker.rarity] || 25);
    let dmg = specialAttackDamage(attacker, defender);
    const isCrit = Math.random() * 100 < specialCritChance(attacker);
    if (isCrit) dmg *= 1.35;
    if (firstStrike) dmg *= 1.10;
    dmg *= freezeMult;
    if (defender.blockActive) { dmg *= 0.40; defender.blockActive = false; }
    dmg = Math.max(1, Math.round(dmg));
    defender.hp = Math.max(0, defender.hp - dmg);
    fxDmg = dmg; fxCrit = isCrit;
    log.push(`\uD83D\uDD25 ${attacker.name} unleashes \u300C${specialMoveName(attacker)}\u300D on ${defender.name} for ${dmg}${isCrit ? ' (CRITICAL!)' : ''}!`);
    attacker.ultimateEnergy = Math.min(100, attacker.ultimateEnergy + 12);
    defender.ultimateEnergy = Math.min(100, defender.ultimateEnergy + 6);
    const statusType = specialStatusFor(attacker);
    if (statusType && defender.hp > 0 && Math.random() < 0.35) {
      if (statusType === 'attackBoost') applyStatusEffect(attacker, statusType, log);
      else applyStatusEffect(defender, statusType, log);
    }
  } else { // basic
    let dmg = basicAttackDamage(attacker, defender);
    const isCrit = Math.random() * 100 < basicCritChance(attacker);
    if (isCrit) dmg *= 1.50;
    if (firstStrike) dmg *= 1.10;
    dmg *= freezeMult;
    let countered = false, counterDmg = 0;
    if (defender.blockActive) {
      dmg *= 0.40;
      defender.blockActive = false;
      if (Math.random() * 100 < counterChance(defender)) {
        countered = true;
        counterDmg = Math.max(1, Math.round(effAttack(defender) * 0.50));
        attacker.hp = Math.max(0, attacker.hp - counterDmg);
        defender.ultimateEnergy = Math.min(100, defender.ultimateEnergy + 10);
      }
    }
    dmg = Math.max(1, Math.round(dmg));
    defender.hp = Math.max(0, defender.hp - dmg);
    fxDmg = dmg; fxCrit = isCrit; fxCounter = countered ? counterDmg : 0;
    log.push(`\u2694\uFE0F ${attacker.name} uses ${basicMoveName(attacker)} on ${defender.name} for ${dmg}${isCrit ? ' (CRITICAL!)' : ''}!`);
    if (countered) log.push(`\uD83E\uDE78 ${defender.name} counters back for ${counterDmg}!`);
    attacker.ultimateEnergy = Math.min(100, attacker.ultimateEnergy + 8);
    defender.ultimateEnergy = Math.min(100, defender.ultimateEnergy + 6);
  }

  attacker.manaPool = Math.min(150, attacker.manaPool + 10);

  // Hand the just-resolved action to the animation layer; playCombatFx() picks this up
  // right after the next render() and plays it against the live DOM nodes.
  if (G && G.attackUI) G.attackUI.fx = {
    attackerSide: side,
    defenderSide: side === 'A' ? 'B' : 'A',
    action, dmg: fxDmg, crit: fxCrit, counter: fxCounter,
    moveName: action === 'legendary' ? legendaryMoveName(attacker)
            : action === 'special' ? specialMoveName(attacker)
            : action === 'block' ? 'Block' : basicMoveName(attacker),
    banner: (action === 'legendary' || action === 'special')
  };

  if (defender.hp <= 0) {
    attacker.ultimateEnergy = Math.min(100, attacker.ultimateEnergy + 20);
    log.push(`\uD83D\uDC80 ${defender.name} has been defeated!`);
  }

  finishEncounterOrAdvance(m);
}

function finishEncounterOrAdvance(m) {
  const state = checkMatchupState(m);
  if (state !== 'ongoing') {
    G.attackUI.lastState = state;
    G.attackUI.stage = 'duel-result';
    render();
    return;
  }
  advanceTurn(m);
}

function advanceTurn(m) {
  m.turn = m.turn === 'A' ? 'B' : 'A';
  render();
}

// Computes who acts first for a freshly-formed 1v1 pairing (Initiative = Speed +
// Random(0-50)) and clears each side's "have I acted yet" flag so the Speed Advantage
// first-strike bonus can trigger again for this new pairing.
function beginEncounterTurnOrder(m) {
  m.activeA._hasActed = false;
  m.activeB._hasActed = false;
  const initA = m.activeA.speed + randInt(0, 50);
  const initB = m.activeB.speed + randInt(0, 50);
  m.turn = initA >= initB ? 'A' : 'B';
}

// Pick a character out of a pool by uid and set it as the active fighter for that side,
// resetting their per-duel Mana Pool / Ultimate Energy / status effects fresh.
function pickActive(matchup, side, uid) {
  const poolKey = side === 'A' ? 'poolA' : 'poolB';
  const activeKey = side === 'A' ? 'activeA' : 'activeB';
  const pool = matchup[poolKey];
  const idx = pool.findIndex(c => c.uid === uid);
  if (idx === -1) return false;
  matchup[activeKey] = pool.splice(idx, 1)[0];
  initFighterCombatState(matchup[activeKey]);
  return true;
}

function sidePlayerHasMoreFighters(matchup, side) {
  const pool = side === 'A' ? matchup.poolA : matchup.poolB;
  return pool.length > 0;
}

// Call after a duel ends (one active hit 0 HP) to figure out what happens next.
// Returns one of: 'relay-a' | 'relay-b' | 'winner-a' | 'winner-b' | 'ongoing'
function checkMatchupState(matchup) {
  const aDown = matchup.activeA && matchup.activeA.hp <= 0;
  const bDown = matchup.activeB && matchup.activeB.hp <= 0;
  if (aDown) {
    matchup.activeA = null;
    if (sidePlayerHasMoreFighters(matchup, 'A')) return 'relay-a';
    matchup.winnerId = matchup.playerBId;
    return 'winner-b';
  }
  if (bDown) {
    matchup.activeB = null;
    if (sidePlayerHasMoreFighters(matchup, 'B')) return 'relay-b';
    matchup.winnerId = matchup.playerAId;
    return 'winner-a';
  }
  return 'ongoing';
}

</script>
<script>
// ====== GLOBAL STATE ======
var G = null;

// ====== ONLINE PLAY (device-to-device via WebRTC/PeerJS) ======
// One device is the "host" and holds the authoritative G; it re-broadcasts the full
// state to every connected client after each render(). Clients never mutate their own
// G directly — every game-changing button click is forwarded to the host instead (see
// the action-interception block near the bottom of this file) and applied there.
// This is a trust-based MVP: state is sent in full to every device, so a technically
// savvy client could inspect info a strict implementation would keep hidden (frozen
// auction order, concealed cards, etc.) via devtools. Good enough for playing with
// friends; real hidden-information support would need per-recipient state redaction.
var Net = {
  mode: 'local',        // 'local' | 'host' | 'client'
  peer: null,
  conns: {},            // host: peerId -> DataConnection
  hostConn: null,       // client: DataConnection to the host
  lobby: null,           // { seatCount, players: [{name, peerId}] }
  roomCode: null,
  myPlayerId: null,     // which G.players[i].id this device controls once in-game
  inGame: false,
  uiScreen: null,       // null | 'choose' | 'hostSetup' | 'hostConnecting' | 'hostLobby' | 'joinSetup' | 'joinConnecting' | 'clientLobby'
  uiError: null
};

Net.reset = function () {
  try { if (Net.peer) Net.peer.destroy(); } catch (e) {}
  Net.mode = 'local';
  Net.peer = null;
  Net.conns = {};
  Net.hostConn = null;
  Net.lobby = null;
  Net.roomCode = null;
  Net.myPlayerId = null;
  Net.inGame = false;
  Net.uiScreen = null;
  Net.uiError = null;
};

Net.hostGame = function (name, seatCount) {
  Net.mode = 'host';
  Net.conns = {};
  Net.lobby = { seatCount: seatCount || 4, players: [{ name: (name || 'Host').trim() || 'Host', peerId: null }] };
  Net.uiScreen = 'hostConnecting';
  Net.uiError = null;
  render();
  try {
    Net.peer = new Peer();
  } catch (e) {
    Net.uiError = 'This browser cannot open a WebRTC connection.';
    Net.mode = 'local';
    render();
    return;
  }
  Net.peer.on('open', function (id) {
    Net.roomCode = id;
    Net.uiScreen = 'hostLobby';
    render();
  });
  Net.peer.on('connection', function (conn) {
    conn.on('data', function (msg) { Net.handleHostMessage(conn, msg); });
    conn.on('close', function () {
      delete Net.conns[conn.peer];
      if (Net.lobby) Net.lobby.players = Net.lobby.players.filter(p => p.peerId !== conn.peer);
      Net.broadcastLobby();
      render();
    });
  });
  Net.peer.on('error', function (err) {
    Net.uiError = 'Network error: ' + (err && err.type ? err.type : err);
    render();
  });
};

Net.handleHostMessage = function (conn, msg) {
  if (!msg) return;
  if (msg.type === 'join') {
    if (!Net.lobby || Net.lobby.players.length >= Net.lobby.seatCount) {
      conn.send({ type: 'error', message: 'Room is full.' });
      return;
    }
    Net.conns[conn.peer] = conn;
    Net.lobby.players.push({ name: (msg.name || 'Player').trim() || 'Player', peerId: conn.peer });
    Net.broadcastLobby();
    render();
    return;
  }
  if (msg.type === 'action' && Net.inGame) {
    if (msg.fn === 'resolveTurn') {
      if (G && G.attackUI && G.attackUI.matchup) resolveTurn(G.attackUI.matchup, msg.args && msg.args[0]);
      return;
    }
    const fn = window[msg.fn];
    if (typeof fn === 'function') fn.apply(null, msg.args || []);
  }
};

Net.broadcastLobby = function () {
  Object.values(Net.conns).forEach(c => { if (c.open) c.send({ type: 'lobby', lobby: Net.lobby }); });
};

// Full-state snapshots go over the wire; G.pendingCancelProceed briefly holds a live
// function reference (see offerCancelOrProceed) which can't cross the wire, so it's
// stripped before sending — the host's own copy of it is untouched.
Net.broadcastState = function () {
  if (!G) return;
  const safeState = Object.assign({}, G, { pendingCancelProceed: null });
  Object.values(Net.conns).forEach(c => { if (c.open) c.send({ type: 'state', state: safeState }); });
};

Net.startOnlineGame = function () {
  if (!Net.lobby) return;
  const seatCount = Net.lobby.seatCount;
  const names = [], aiFlags = [];
  for (let i = 0; i < seatCount; i++) {
    const entry = Net.lobby.players[i];
    if (entry) { names.push(entry.name); aiFlags.push(false); }
    else { names.push(`AI ${i + 1}`); aiFlags.push(true); }
  }
  G = createGame(names, aiFlags);
  G.screen = 'draft';
  Net.myPlayerId = 0;
  Net.inGame = true;
  const safeState = Object.assign({}, G, { pendingCancelProceed: null });
  Net.lobby.players.forEach((entry, idx) => {
    if (idx > 0 && entry.peerId && Net.conns[entry.peerId]) {
      Net.conns[entry.peerId].send({ type: 'gameStart', state: safeState, yourSeat: idx });
    }
  });
  render();
};

Net.joinGame = function (code, name) {
  code = (code || '').trim();
  if (!code) { Net.uiError = 'Enter a room code.'; render(); return; }
  Net.mode = 'client';
  Net.uiScreen = 'joinConnecting';
  Net.uiError = null;
  render();
  try {
    Net.peer = new Peer();
  } catch (e) {
    Net.uiError = 'This browser cannot open a WebRTC connection.';
    Net.mode = 'local';
    render();
    return;
  }
  Net.peer.on('open', function () {
    const conn = Net.peer.connect(code);
    Net.hostConn = conn;
    conn.on('open', function () {
      conn.send({ type: 'join', name: (name || 'Player').trim() || 'Player' });
      Net.uiScreen = 'clientLobby';
      render();
    });
    conn.on('data', function (msg) { Net.handleClientMessage(msg); });
    conn.on('close', function () {
      Net.uiError = 'Disconnected from the host.';
      Net.mode = 'local';
      Net.inGame = false;
      render();
    });
    conn.on('error', function (err) {
      Net.uiError = 'Connection failed: ' + (err && err.type ? err.type : err);
      render();
    });
  });
  Net.peer.on('error', function (err) {
    Net.uiError = 'Network error: ' + (err && err.type ? err.type : err);
    render();
  });
};

Net.handleClientMessage = function (msg) {
  if (!msg) return;
  if (msg.type === 'error') { Net.uiError = msg.message; render(); return; }
  if (msg.type === 'lobby') { Net.lobby = msg.lobby; render(); return; }
  if (msg.type === 'gameStart') {
    Net.myPlayerId = msg.yourSeat;
    Net.inGame = true;
    G = msg.state;
    render();
    return;
  }
  if (msg.type === 'state') {
    // Preserve this device's own local-only UI state across the incoming state swap.
    const keepHistoryOpen = G ? G.historyOpen : false;
    const keepCardViewer = G ? G.cardViewer : null;
    G = msg.state;
    G.historyOpen = keepHistoryOpen;
    G.cardViewer = keepCardViewer;
    render();
    return;
  }
};

Net.sendAction = function (fn, args) {
  if (Net.hostConn && Net.hostConn.open) Net.hostConn.send({ type: 'action', fn, args });
};

// Figures out which player id must make the next decision, across every screen/modal
// shape in the game, so a client device can be locked out except on its own turn.
// Returns null when no single player owns the decision (setup, bracket auto-advance,
// game over) — those stay unlocked for everyone.
function currentActorId(G) {
  if (!G) return null;
  if (G.screen === 'discard') return (G.discardQueue && G.discardQueue.length) ? G.discardQueue[0] : null;
  if (G.screen === 'attack') {
    const ui = G.attackUI;
    if (!ui) return null;
    if (ui.stage === 'privacy') return ui.privacy ? ui.privacy.forPlayerId : null;
    if (ui.stage === 'reveal') {
      const m = ui.matchup;
      return m ? (m.turn === 'A' ? m.playerAId : m.playerBId) : null;
    }
    return null;
  }
  if (G.modal) {
    const m = G.modal;
    if (m.type === 'cancelPrompt') return m.targetPlayerId;
    if (m.type === 'shop') return m.forPlayerId;
    if (m.type === 'auction') return m.phase === 'freeze' ? currentFreezeChooser(m) : currentBidder(m);
    if (m.type === 'auctionSetup' || m.type === 'swap' || m.type === 'steal' || m.type === 'wildcardChoice') {
      return activePlayer(G) ? activePlayer(G).id : null;
    }
    return null;
  }
  if (G.screen === 'draft') return activePlayer(G) ? activePlayer(G).id : null;
  return null;
}

// Dims the board and blocks clicks whenever it's genuinely someone else's decision to
// make, on this device, in an online game. Local hotseat play is never touched.
function lockWrap(html) {
  if (!G || Net.mode === 'local' || !Net.inGame || Net.myPlayerId == null) return html;
  const actorId = currentActorId(G);
  if (actorId === null || actorId === Net.myPlayerId) return html;
  const actor = G.players.find(p => p.id === actorId);
  const label = actor ? esc(actor.name) : 'the other player';
  return `<div style="position:relative;">
    <div style="opacity:0.5; pointer-events:none;">${html}</div>
    <div style="position:absolute; inset:0; z-index:45;"></div>
    <div style="position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:46; background:var(--accent); color:#1a1500; padding:8px 18px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,0.4); white-space:nowrap;">
    Waiting for ${label}&hellip;
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  let html = '';
  if (window.__showGallery) html = renderGallery();
  else if (!G || G.screen === 'setup') html = (Net.uiScreen && !Net.inGame) ? renderOnlineScreen() : renderSetup();
  else if (G.screen === 'draft') html = renderDraft();
  else if (G.screen === 'discard') html = renderDiscard();
  else if (G.screen === 'attack') html = renderAttack();
  const activeViewerCard = (G && G.cardViewer) ? G.cardViewer : window.__galleryViewerCard;
  app.innerHTML = lockWrap(html) + renderNotifications() + renderHistoryTab() + (activeViewerCard ? renderCardViewer(activeViewerCard) : '');
  // notifications auto-clear after being shown once
  if (G) setTimeout(() => { if (G) { G.notifications = []; } }, 4200);
  playCombatFx();
  scheduleAI();
  if (Net.mode === 'host' && Net.inGame) Net.broadcastState();
}

// ====== COMBAT ANIMATION LAYER ======
// resolveTurn() stashes a description of what just happened on G.attackUI.fx; this runs
// immediately after the DOM is rebuilt and plays it out: the attacker lunges, the
// defender shakes, a colored flash and slash sweep fire over the struck card, and the
// damage number floats up. Purely cosmetic — it never changes game state.
function playCombatFx() {
  if (!G || !G.attackUI || !G.attackUI.fx) return;
  const fx = G.attackUI.fx;
  G.attackUI.fx = null; // consume it so it only plays once

  const atkEl = document.getElementById('fighter-' + fx.attackerSide);
  const defEl = document.getElementById('fighter-' + fx.defenderSide);
  if (!atkEl || !defEl) return;

  // Attacker lunges toward the opponent (direction depends on which side they're on).
  if (fx.action !== 'block') {
    atkEl.style.setProperty('--lunge', fx.attackerSide === 'A' ? '26px' : '-26px');
    atkEl.classList.add('fx-attack');
    setTimeout(() => atkEl.classList.remove('fx-attack'), 520);
  }

  const flashTarget = fx.action === 'block' ? atkEl : defEl;
  const flash = document.createElement('div');
  flash.className = 'fx-flash ' + (fx.action === 'block' ? 'block' : fx.action);
  flashTarget.appendChild(flash);
  setTimeout(() => flash.remove(), 520);

  if (fx.action === 'block') return;

  // Slash sweep + shake on the defender.
  const slash = document.createElement('div');
  slash.className = 'fx-slash';
  defEl.appendChild(slash);
  setTimeout(() => slash.remove(), 520);

  defEl.classList.add('fx-hit');
  setTimeout(() => defEl.classList.remove('fx-hit'), 520);

  if (fx.dmg > 0) {
    const dmgEl = document.createElement('div');
    dmgEl.className = 'fx-damage' + (fx.crit ? ' crit' : '');
    dmgEl.textContent = '-' + fx.dmg + (fx.crit ? '!' : '');
    defEl.appendChild(dmgEl);
    setTimeout(() => dmgEl.remove(), 1100);
  }

  // A counter-attack knocks damage back the other way.
  if (fx.counter > 0) {
    setTimeout(() => {
      atkEl.classList.add('fx-hit');
      setTimeout(() => atkEl.classList.remove('fx-hit'), 520);
      const cEl = document.createElement('div');
      cEl.className = 'fx-damage';
      cEl.textContent = '-' + fx.counter;
      atkEl.appendChild(cEl);
      setTimeout(() => cEl.remove(), 1100);
    }, 260);
  }

  // Special and Legendary attacks announce themselves by name.
  if (fx.banner) {
    const banner = document.createElement('div');
    banner.className = 'fx-banner';
    banner.textContent = (fx.action === 'legendary' ? '\u265B ' : '\u2726 ') + fx.moveName;
    document.body.appendChild(banner);
    setTimeout(() => banner.remove(), 1300);
  }
}

function renderNotifications() {
  if (!G || !G.notifications || G.notifications.length === 0) return '';
  return `<div class="notif">${G.notifications.map(n => `<div class="notif-item">${esc(n)}</div>`).join('')}</div>`;
}

// ====== HISTORY TAB ======
// Everything that happens — including every move the robot players make — is recorded
// here and colour-coded by event type, so AI turns can be reviewed at leisure instead
// of flashing past as toasts.
const HISTORY_KIND_META = {
  ai:      { label: 'ROBOT',   cls: 'h-ai' },
  auction: { label: 'AUCTION', cls: 'h-auction' },
  wild:    { label: 'WILDCARD',cls: 'h-wild' },
  combat:  { label: 'COMBAT',  cls: 'h-combat' },
  set:     { label: 'SET',     cls: 'h-set' },
  phase:   { label: 'PHASE',   cls: 'h-phase' },
  draw:    { label: 'DRAW',    cls: 'h-draw' },
  '':      { label: 'GAME',    cls: 'h-none' }
};

function toggleHistory() { G.historyOpen = !G.historyOpen; render(); }

function renderHistoryTab() {
  if (!G || G.screen === 'setup') return '';
  const count = G.history ? G.history.length : 0;
  const btn = `<button class="history-toggle" onclick="toggleHistory()">&#128220; History${count ? ` (${count})` : ''}</button>`;
  if (!G.historyOpen) return btn;
  const items = (G.history || []).map(h => {
    const meta = HISTORY_KIND_META[h.kind] || HISTORY_KIND_META[''];
    // A robot's move always reads as ROBOT regardless of the event's own category,
    // so it's obvious at a glance which lines the player didn't do themselves.
    const cls = h.ai ? 'h-ai' : meta.cls;
    const label = h.ai ? `ROBOT &middot; ${meta.label}` : meta.label;
    return `<div class="hist-item ${cls}">
      <span class="hist-tag">${label}</span>
      <span class="hist-msg">${esc(h.msg)}</span>
    </div>`;
  }).join('');
  return `${btn}
  <div class="history-panel">
    <div class="history-head">
      <b>Game History</b>
      <div style="display:flex; gap:8px; align-items:center;">
        <span style="font-size:11px; color:var(--ink-dim);">newest first</span>
        <button class="btn btn-sm" onclick="toggleHistory()">Close</button>
      </div>
    </div>
    <div class="history-legend">
      <span class="hist-tag h-ai">ROBOT</span>
      <span class="hist-tag h-auction">AUCTION</span>
      <span class="hist-tag h-wild">WILDCARD</span>
      <span class="hist-tag h-combat">COMBAT</span>
      <span class="hist-tag h-set">SET</span>
      <span class="hist-tag h-draw">DRAW</span>
    </div>
    <div class="history-body">${items || '<div style="color:var(--ink-dim); font-size:12.5px; padding:10px;">Nothing has happened yet.</div>'}</div>
  </div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function wildcardTagHtml(type, extraInnerHtml) {
  const info = WILDCARD_TYPES[type];
  const r = RARITY[info.rarity];
  const color = r ? r.color : 'var(--ink-dim)';
  return `<span class="tag-pill" style="border-color:${color}; color:${color};">
    <span style="font-weight:700;">${esc(info.label)}</span>
    <span style="opacity:0.75; margin-left:5px; font-size:9px; text-transform:uppercase; letter-spacing:0.4px;">${esc(info.rarity)}</span>
    ${extraInnerHtml || ''}
  </span>`;
}

// ====== CARD RENDERING ======

function rarityStyle(rarity) {
  const r = RARITY[rarity];
  return `border-color:${r.color}; background: linear-gradient(160deg, ${r.dark}, var(--bg-panel-2));`;
}

// ====== CARD ART ======
// Drop image files into an "images" folder next to this HTML file, named by the
// character's numeric id: images/1.jpg, images/2.jpg, ... images/360.jpg (see the
// manifest file for the full id -> name -> series list). .jpg is tried first, then
// .png. If neither file exists, the card just shows a colored initial instead —
// nothing breaks while you're still sourcing art.
function imageCandidates(c) {
  return [`images/${c.id}.jpg`, `images/${c.id}.png`, `images/${c.id}.webp`];
}

function cardImageHtml(c, big) {
  const [first, ...rest] = imageCandidates(c);
  const nextAttr = rest.map(esc).join('|');
  return `<div class="card-img-wrap">
    <img src="${esc(first)}" data-fallbacks="${nextAttr}" alt="${esc(c.name)}"
      onerror="handleCardImgError(this)" />
  </div>`;
}

// Tries each remaining candidate path in turn; once they're all exhausted, swaps the
// <img> out for a plain initial badge so the layout never breaks.
function handleCardImgError(img) {
  const remaining = (img.getAttribute('data-fallbacks') || '').split('|').filter(Boolean);
  if (remaining.length === 0) {
    const wrap = img.parentElement;
    const initial = esc((img.alt || '?').trim().charAt(0).toUpperCase());
    wrap.innerHTML = `<div class="card-img-fallback">${initial}</div>`;
    return;
  }
  const next = remaining.shift();
  img.setAttribute('data-fallbacks', remaining.join('|'));
  img.src = next;
}

function renderCardMini(c, opts) {
  opts = opts || {};
  const r = RARITY[c.rarity];
  const dead = c.hp !== undefined && c.hp <= 0;
  const hpPct = c.maxHp ? Math.max(0, Math.round((c.hp / c.maxHp) * 100)) : 100;
  const classes = ['card'];
  if (opts.selectable) classes.push('selectable');
  if (opts.selected) classes.push('selected');
  if (dead) classes.push('dead');
  const clickAttr = opts.onclick ? `onclick="${opts.onclick}"` : '';
  const cardData = esc(JSON.stringify(c));
  return `<div class="${classes.join(' ')}" style="${rarityStyle(c.rarity)}" ${clickAttr} title="${esc(c.name)}">
    <button type="button" class="card-view-btn" title="View full stats" data-card="${cardData}" onclick="event.stopPropagation(); openCardViewer(this);">&#128269;</button>
    <div class="rarity-tag" style="background:${r.color}; color:#1a1500;">${c.rarity}</div>
    ${cardImageHtml(c, false)}
    <div class="cname">${esc(c.name)}</div>
    <div class="cseries">${esc(c.series)}</div>
    <div class="powerline">&#9889;${c.powerLevel} &middot; &#128168;${c.speed}</div>
    <div class="stats">
      <div class="stat">DEF<b>${c.defense}</b></div>
      <div class="stat">HP<b>${c.hp !== undefined ? c.hp : c.maxHp}</b></div>
    </div>
    ${c.hp !== undefined ? `<div class="hpbar-wrap"><div class="hpbar" style="width:${hpPct}%; background:${hpPct<30?'var(--danger)':'var(--good)'}"></div></div>` : ''}
  </div>`;
}

// `conceal` blurs the stat block and move list: used for the opponent's fighter so a
// player can't read their exact numbers or which techniques they still have available.
function renderCardBig(c, conceal) {
  const r = RARITY[c.rarity];
  const hpPct = c.maxHp ? Math.max(0, Math.round((c.hp / c.maxHp) * 100)) : 100;
  return `<div class="card big${conceal ? ' concealed' : ''}" style="${rarityStyle(c.rarity)}">
    <div class="rarity-tag" style="background:${r.color}; color:#1a1500;">${c.rarity}</div>
    ${cardImageHtml(c, true)}
    <div class="cname">${esc(c.name)}</div>
    <div class="cseries">${esc(c.series)}</div>
    <div class="powerline big">&#9889; ${c.powerLevel} POWER &middot; &#128168; ${c.speed} SPEED</div>
    <div class="stats">
      <div class="stat">ATK<b>${c.attack}</b></div>
      <div class="stat">SPA<b>${c.specialAttack}</b></div>
      <div class="stat">DEF<b>${c.defense}</b></div>
      <div class="stat">MNA<b>${c.mana}</b></div>
      <div class="stat">IQ<b>${c.iq}</b></div>
    </div>
    <div class="hpbar-wrap"><div class="hpbar" style="width:${hpPct}%; background:${hpPct<30?'var(--danger)':'var(--good)'}"></div></div>
    <div style="margin-top:4px; font-size:10.5px; color:var(--ink-dim);">HP ${c.hp}/${c.maxHp}</div>
    ${c.bonuses && c.bonuses.length ? `<div style="margin-top:6px;">${c.bonuses.map(b=>`<span class="tag-pill">${esc(b)}</span>`).join('')}</div>` : ''}
    <div class="movelist">
      <div class="move-row"><span class="move-ico">&#9876;&#65039;</span>${esc(basicMoveName(c))}</div>
      ${c.specialAttack > 0
        ? `<div class="move-row"><span class="move-ico">&#128293;</span>${esc(specialMoveName(c))}</div>`
        : `<div class="move-row muted"><span class="move-ico">&#128293;</span>No Special Attack</div>`}
      ${c.rarity === 'Legendary' ? `<div class="move-row legend"><span class="move-ico">&#128081;</span>${esc(legendaryMoveName(c))}</div>` : ''}
    </div>
    ${conceal ? '<div class="conceal-note">&#128274; Opponent\'s stats hidden</div>' : ''}
  </div>`;
}

// Wraps a freshly-drawn character in a tier-specific reveal animation (see the
// .reveal-* CSS above) — Common is a quick fade, Rare/Epic get progressively more
// dramatic flashes, and Legendary gets the full golden shockwave + shimmer sweep.
function renderCardReveal(c) {
  const tierClass = 'reveal-' + c.rarity.toLowerCase();
  return `<div class="reveal-stage ${tierClass}">
    <div class="reveal-burst"></div>
    ${renderCardBig(c)}
  </div>`;
}

// Full-screen, dead-center version of the reveal used right after a draft draw —
// tap anywhere to dismiss it and get back to the draft panel underneath.
function renderCardRevealOverlay(c) {
  return `<div class="reveal-overlay" onclick="dismissCardReveal()">
    ${renderCardReveal(c)}
    <div class="reveal-hint">Tap anywhere to continue</div>
  </div>`;
}

function dismissCardReveal() {
  G.revealDismissed = true;
  render();
}

// Simple uid-based lookup for the one spot (the post-draw summary line) that only
// has a uid handy rather than the full card object already in hand.
function viewCard(uid) {
  if (G.pendingCharacterDraw && G.pendingCharacterDraw.uid === uid) {
    G.cardViewer = G.pendingCharacterDraw;
    render();
  }
}

function galleryPreviewCard(c) {
  const full = { ...c };

  full.maxHp = deriveMaxHp(full);
  full.hp = full.maxHp;
  return full;
}
