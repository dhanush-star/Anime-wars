function showRulesNotes() {
  alert(
    "A few gaps in the design doc were filled in with house-rule defaults — tune these in the code as you playtest:\n\n" +
    "- Coin/Wildcard deck: 43 cards (24 coin cards worth 2/3/5, 19 wildcards split across the 7 types, including the new Cancel Card).\n" +
    "- Character stats are fixed per the card stat sheet (Power / Attack / Special Attack / Defense / Mana), not randomized. HP is derived from Power + Defense. Two extra headline numbers — Power Level and Speed, both scaled 0-1000 — are derived from those same sub-stats individually per character, and recompute automatically whenever set bonuses change a card's sub-stats.\n" +
    "- Combat: d20 + Attack vs (10 + half defender's Defense), hits deal roughly 10-16 damage (scaled by Attack, softened by Defense).\n" +
    "- Special Move: guarantees a hit and scales off Special Attack + Mana, usable once per character per matchup — but only characters with Special Attack above 0 can ever use one. Every Common starts at Special Attack 0, so they can't use a Special Move unless a Rarity Set bonus lifts them above it.\n" +
    "- Whoever has the higher Speed stat swings first each round of a duel (per the design doc).\n" +
    "- Series Set (3+ cards, same series) grants +2 Attack/+2 Defense to those cards; Rarity Set (3+ cards, same rarity) grants +4 Power/+3 Special Attack.\n" +
    "- Between separate bracket matchups, all characters heal back to full HP and each character's Special Move becomes available again (it's 'once per matchup', not once per game).\n" +
    "- Discards from the down-to-5 trim are gone for good (shown in a visible discard pile).\n" +
    "- Auctions: open ascending bidding among everyone except the card's owner; if nobody ever bids, the card stays put.\n" +
    "- Bracket byes are assigned by random draw for odd player counts (3, 5, or 7 players).\n" +
    "- The Jujutsu Kaisen roster's duplicate 'Kechizu' listing was resolved by keeping it once, under Rare, per your own note in the doc (360 characters total, not 361)."
  );
}

function startGame(n) {
  const names = [];
  const aiFlags = [];
  for (let i = 0; i < n; i++) {
    const custom = (window.__setupNames || [])[i];
    names.push(custom && custom.trim() ? custom.trim() : `Player ${i+1}`);
    aiFlags.push(!!(window.__setupAI && window.__setupAI[i]));
  }
  G = createGame(names, aiFlags);
  G.screen = 'draft';
  render();
}

// ====== DRAFT PHASE ======

function renderDraft() {
  const p = activePlayer(G);
  const modalHtml = G.modal ? renderModal() : '';
  const readyCount = G.players.filter(pl => pl.floor.length >= 10).length;
  return `
  <div class="topbar">
    <div>
      <div class="title">Anime Alliance — Draft Phase</div>
      <div class="subtitle">${esc(p.name)}'s turn &middot; ${readyCount}/${G.players.length} players have 10 characters</div>
    </div>
    <div class="row">
      <span class="helpicon" onclick="alert('Draw 1 Character card and 1 Coin/Wildcard card each turn. Wildcards (power-up cards) each have a rarity, shown on their tag. Steal, Swap, and Auction cards target an opponent — if that opponent is holding a Cancel Card, they get a chance to block the effect completely before it happens. The draft keeps going, player by player, until every player has 10 characters on their floor — only then does the Attack Phase begin (any floor left over 10 from bonus cards gets trimmed down first).')">how this works</span>
    </div>
  </div>
  ${renderDraftActionArea(p)}
  ${G.players.map(pl => renderPlayerPanelDraft(pl, pl.id === p.id)).join('')}
  ${modalHtml}
  `;
}

function renderDraftActionArea(p) {
  let body = '';
  if (G.draftStage !== 'drawn') {
    body = `<button class="btn btn-primary" onclick="drawCardsForTurn()">Draw Cards for ${esc(p.name)}</button>`;
  } else {
    // The animated full-screen reveal is only worth pausing for on a human's own
    // turn — AI turns still record what they drew (for the log/view-card link) but
    // skip straight past the flashy overlay so multi-bot games don't crawl.
    const showOverlay = G.pendingCharacterDraw && !G.revealDismissed && !p.isAI;
    const bits = [];
    if (G.pendingCharacterDraw) bits.push(`<div>Drew character: <b>${esc(G.pendingCharacterDraw.name)}</b> (${G.pendingCharacterDraw.rarity})${showOverlay ? '' : ' — <a style="color:var(--accent); cursor:pointer;" onclick="viewCard(' + G.pendingCharacterDraw.uid + ')">view card</a>'}</div>`);
    if (G.pendingSkipNote) bits.push(`<div>${esc(G.pendingSkipNote)}</div>`);
    if (G.pendingCoinResult) bits.push(`<div style="margin-top:8px;">${esc(G.pendingCoinResult)}</div>`);
    const canEnd = !G.modal;
    body = `<div style="margin-bottom:10px; font-size:13.5px; color:var(--ink-dim);">${bits.join('')}</div>
      <button class="btn btn-primary" ${canEnd ? '' : 'disabled'} onclick="endTurn()">End Turn</button>
      ${showOverlay ? renderCardRevealOverlay(G.pendingCharacterDraw) : ''}`;
  }
  return `<div class="panel">${body}</div>`;
}

function renderPlayerPanelDraft(pl, isActive) {
  const canUseHeld = isActive && !G.modal;
  const heldHtml = pl.heldWildcards.length
    ? `<div class="row" style="margin-top:8px;">${pl.heldWildcards.map(w => {
        const useLink = canUseHeld ? ` <a style="color:var(--accent); cursor:pointer; margin-left:4px;" onclick="useHeldWildcard(${w.uid})">Use</a>` : '';
        return wildcardTagHtml(w.type, useLink);
      }).join('')}</div>`
    : '';
  return `<div class="player-panel ${isActive ? 'is-active' : ''}">
    <div class="player-head">
      <div class="player-name">${esc(pl.name)}</div>
      ${pl.isAI ? '<span class="player-badge" style="border-color:var(--accent); color:var(--accent);">&#129302; AI</span>' : ''}
      ${isActive ? '<span class="player-badge turn">Current Turn</span>' : ''}
      <div class="spacer"></div>
      <div class="bank">${pl.bank} coins</div>
    </div>
    <div class="team-strength">&#127942; Total Team Strength: <b>${teamStrength(pl.floor).toLocaleString()}</b></div>
    <div class="floor">
      ${pl.floor.map(c => renderCardMini(c)).join('') || '<div style="color:var(--ink-dim); font-size:12.5px;">No characters yet.</div>'}
    </div>
    ${heldHtml}
  </div>`;
}

function drawCardsForTurn() {
  const p = activePlayer(G);
  G.revealDismissed = false;
  if (p.floor.length < 10) {
    const charCard = drawCharacterCard(G);
    if (charCard) p.floor.push(charCard);
    G.pendingCharacterDraw = charCard;
  } else {
    G.pendingCharacterDraw = null;
    G.pendingSkipNote = `${p.name} already has 10 characters — no character card drawn this turn.`;
  }

  const cw = drawCoinWildcardCard(G);
  if (cw.kind === 'coin') {
    p.coinPile.push(cw);
    p.bank += cw.value;
    G.pendingCoinResult = `+${cw.value} coins (bank now ${p.bank})`;
    G.draftStage = 'drawn';
  } else if (cw.type === 'CANCEL') {
    p.heldWildcards.push({ uid: nextUid(), type: 'CANCEL' });
    G.pendingCoinResult = `${p.name} drew a Cancel Card — held automatically. It triggers if someone targets ${p.name} with a Steal, Swap, or Auction.`;
    G.draftStage = 'drawn';
  } else {
    const drawTier = stealTierOf(cw.type);
    if (drawTier && !G.players.some(pl => pl.id !== p.id && pl.floor.some(c => c.rarity === drawTier))) {
      G.pendingCoinResult = `${p.name} drew ${WILDCARD_TYPES[cw.type].label}, but no opponent holds a ${drawTier} character — it fizzles.`;
      G.draftStage = 'drawn';
    } else {
      G.modal = { type: 'wildcardChoice', wtype: cw.type };
      G.draftStage = 'drawn';
    }
  }
  render();
}

// Tiered steals: STEAL_C/R/E/L. Returns the rarity tier a steal card targets, or null.
function stealTierOf(type) {
  const def = WILDCARD_TYPES[type];
  return def && def.stealTier ? def.stealTier : null;
}
function isStealType(type) { return !!stealTierOf(type); }

function chooseWildcard(choice) {
  const wtype = G.modal.wtype;
  const p = activePlayer(G);
  if (choice === 'hold') {
    p.heldWildcards.push({ uid: nextUid(), type: wtype });
    G.pendingCoinResult = (G.pendingCoinResult ? G.pendingCoinResult + ' &middot; ' : '') + `Held ${WILDCARD_TYPES[wtype].label} for later`;
    G.modal = null;
    render();
    return;
  }
  G.modal = null;
  beginWildcardEffect(wtype);
}

function useHeldWildcard(cardUid) {
  const p = activePlayer(G);
  const idx = p.heldWildcards.findIndex(w => w.uid === cardUid);
  if (idx === -1) return;
  const w = p.heldWildcards[idx];
  if (w.type === 'FREEZE') {
    alert('Freeze Auction can only be used while an auction is in progress — it will show up as an option there.');
    return;
  }
  if (w.type === 'CANCEL') {
    alert(`Cancel Cards can't be played on ${p.name}'s own turn — they automatically trigger when an opponent targets ${p.name} with a Steal, Swap, or Auction.`);
    return;
  }
  const heldTier = stealTierOf(w.type);
  if (heldTier && !G.players.some(pl => pl.id !== p.id && pl.floor.some(c => c.rarity === heldTier))) {
    alert(`No opponent is holding a ${heldTier} character right now, so ${WILDCARD_TYPES[w.type].label} has nothing to take.`);
    return;
  }
  p.heldWildcards.splice(idx, 1);
  beginWildcardEffect(w.type);
}

function beginWildcardEffect(type) {
  const p = activePlayer(G);
  if (type === 'AUCTION') {
    const opponents = G.players.filter(pl => pl.id !== p.id && pl.floor.length > 0);
    if (opponents.length === 0) { notify(G, 'No opponent has a character to auction yet — the card fizzles.'); G.modal = null; render(); return; }
    G.modal = { type: 'auctionSetup', selectedOwnerId: null, selectedCardUid: null };
  } else if (type === 'SHOP') {
    openShopPrivacy();
    return;
  } else if (type === 'SWAP') {
    const opponents = G.players.filter(pl => pl.id !== p.id && pl.floor.length > 0);
    if (opponents.length === 0 || p.floor.length === 0) { notify(G, 'No valid swap available right now — the card fizzles.'); G.modal = null; render(); return; }
    G.modal = { type: 'swap', myUid: null, theirOwnerId: null, theirUid: null };
  } else if (isStealType(type)) {
    const tier = stealTierOf(type);
    const opponents = G.players.filter(pl => pl.id !== p.id && pl.floor.some(c => c.rarity === tier));
    if (opponents.length === 0) { notify(G, `No opponent holds a ${tier} character — the card fizzles.`, 'wild'); G.modal = null; render(); return; }
    G.modal = { type: 'steal', stealOwnerId: null, stealTier: tier, stealLabel: WILDCARD_TYPES[type].label };
  } else if (type === 'DBLBID') {
    p.doubleBidArmed = true;
    notify(G, `${p.name} armed Double Bid — their next auction bid counts double!`, 'wild');
    G.modal = null;
  } else if (type === 'FREEZE') {
    notify(G, 'Freeze Auction has no effect outside of an active auction — held instead.');
    p.heldWildcards.push({ uid: nextUid(), type: 'FREEZE' });
    G.modal = null;
  }
  render();
}

function endTurn() {
  G.modal = null;
  G.pendingCharacterDraw = null;
  G.pendingSkipNote = null;
  G.pendingCoinResult = null;

  // Only leave the draft phase once every player has reached 10 characters —
  // never based on a fixed number of rounds or on any single player's count.
  if (G.players.every(pl => pl.floor.length >= 10)) {
    finishDraftPhase();
    return;
  }

  const n = G.players.length;
  if (G.currentPlayerIndex === n - 1) {
    G.currentPlayerIndex = 0;
  } else {
    G.currentPlayerIndex++;
  }
  G.draftStage = 'ready';
  render();
}

function finishDraftPhase() {
  G.discardQueue = G.players.filter(pl => pl.floor.length > 10).map(pl => pl.id);
  G.discardSelection = [];
  if (G.discardQueue.length > 0) {
    G.screen = 'discard';
  } else {
    beginAttackPhase();
    return;
  }
  render();
}

// --- Cancel Card interception ---
// Call this before applying an effect that targets a specific opponent (Steal, Swap,
// Auction). If that opponent holds a Cancel Card, they're offered the chance to block
// the effect entirely before it happens; otherwise proceedFn runs immediately.
function offerCancelOrProceed(targetPlayerId, kind, proceedFn) {
  const target = G.players.find(p => p.id === targetPlayerId);
  const hasCancel = target && target.heldWildcards.some(w => w.type === 'CANCEL');
  if (!hasCancel) { proceedFn(); return; }
  G.pendingCancelProceed = proceedFn;
  G.modal = { type: 'cancelPrompt', kind, targetPlayerId };
  render();
}

const CANCEL_KIND_LABEL = { steal: 'Steal Card', swap: 'Swap Card', auction: 'Auction Card' };

function renderCancelPromptModal() {
  const m = G.modal;
  const target = G.players.find(p => p.id === m.targetPlayerId);
  return modalWrap(`
    <h2>${esc(target.name)} is being targeted!</h2>
    <div class="desc">Someone is using a ${esc(CANCEL_KIND_LABEL[m.kind] || 'power-up card')} against ${esc(target.name)}. ${esc(target.name)} is holding a Cancel Card — use it to block this effect completely?</div>
    <div class="row">
      <button class="btn btn-danger" onclick="resolveCancelPrompt(true)">Use Cancel Card — Block It</button>
      <button class="btn btn-primary" onclick="resolveCancelPrompt(false)">Allow It</button>
    </div>
  `);
}

function resolveCancelPrompt(useCancel) {
  const m = G.modal;
  const target = G.players.find(p => p.id === m.targetPlayerId);
  const proceed = G.pendingCancelProceed;
  G.pendingCancelProceed = null;
  if (useCancel) {
    const idx = target.heldWildcards.findIndex(w => w.type === 'CANCEL');
    if (idx > -1) target.heldWildcards.splice(idx, 1);
    notify(G, `${target.name} used a Cancel Card to block the ${esc(CANCEL_KIND_LABEL[m.kind] || 'effect')}!`);
    G.modal = null;
    render();
  } else {
    G.modal = null;
    proceed();
  }
}

function renderWildcardChoiceModal() {

function selectAuctionCard(ownerId, uid) {

  G.modal.selectedCardUid = uid;

function confirmStartAuction() {
  const m = G.modal;
  if (m.selectedOwnerId == null) return;
  const ownerId = m.selectedOwnerId;
  const cardUid = m.selectedCardUid;
  offerCancelOrProceed(ownerId, 'auction', () => beginAuction(ownerId, cardUid));
}

// Structured auction, run in two ordered phases:
//   PHASE 1 (freeze) — every Freeze Auction holder is offered the chance to use it, in a
//     fixed order: all HUMAN holders first (so a player never gets pre-empted by a bot),
//     then the AI holders. Each one either freezes somebody out or passes.
//   PHASE 2 (bidding) — bidding runs strictly in player order (by seat number), one bidder
//     at a time, looping around. On your turn you either raise or pass; passing drops you
//     out for good. It ends when only the highest bidder is left standing.
function beginAuction(ownerId, cardUid) {
  const eligible = G.players.filter(p => p.id !== ownerId).map(p => p.id).sort((a, b) => a - b);
  const freezeHolders = G.players
    .filter(p => p.heldWildcards.some(w => w.type === 'FREEZE'))
    .sort((a, b) => (a.isAI === b.isAI) ? a.id - b.id : (a.isAI ? 1 : -1))
    .map(p => p.id);
  G.modal = {
    type: 'auction',
    ownerId,
    cardUid,
    remaining: eligible,
    bidOrder: eligible.slice(),
    turnIdx: 0,
    phase: freezeHolders.length ? 'freeze' : 'bidding',
    freezeQueue: freezeHolders,
    freezeIdx: 0,
    highestBid: 0,
    highestEffective: 0,
    highestBidderId: null
  };
  logHistory(G, `Auction opened for ${G.players.find(p=>p.id===ownerId).floor.find(c=>c.uid===cardUid).name}.`, 'auction');
  render();
}

function auctionActionsRemaining(m) {
  return m.remaining.filter(id => id !== m.highestBidderId);
}

// Whose freeze decision are we waiting on right now?
function currentFreezeChooser(m) {
  if (m.phase !== 'freeze') return null;
  while (m.freezeIdx < m.freezeQueue.length) {
    const id = m.freezeQueue[m.freezeIdx];
    const pl = G.players.find(p => p.id === id);
    // Skip anyone who no longer holds a Freeze, or has nobody left to freeze.
    if (pl && pl.heldWildcards.some(w => w.type === 'FREEZE') && m.remaining.some(r => r !== id)) return id;
    m.freezeIdx++;
  }
  return null;
}

function advanceFreezePhase() {
  const m = G.modal;
  m.freezeIdx++;
  if (currentFreezeChooser(m) == null) {
    m.phase = 'bidding';
    m.turnIdx = 0;
    logHistory(G, 'Freeze window closed — bidding begins, in seat order.', 'auction');
  }
  render();
}

function skipFreeze(playerId) {
  const pl = G.players.find(p => p.id === playerId);
  logHistory(G, `${pl.name} declined to use Freeze Auction.`, 'auction');
  advanceFreezePhase();
}

// Whose bid are we waiting on? Walks forward from turnIdx to the next player who is
// still in and isn't already the high bidder.
function currentBidder(m) {
  if (m.phase !== 'bidding') return null;
  const active = auctionActionsRemaining(m);
  if (active.length === 0) return null;
  const order = m.bidOrder.filter(id => active.includes(id));
  if (order.length === 0) return null;
  if (m.turnIdx >= order.length) m.turnIdx = 0;
  return order[m.turnIdx];
}

function advanceBidTurn() {
  const m = G.modal;
  const active = auctionActionsRemaining(m);
  const order = m.bidOrder.filter(id => active.includes(id));
  if (order.length === 0) { resolveAuctionEnd(); return; }
  m.turnIdx = (m.turnIdx + 1) % order.length;
  render();
}

function renderAuctionModal() {
  const m = G.modal;
  const owner = G.players.find(p => p.id === m.ownerId);
  const card = owner.floor.find(c => c.uid === m.cardUid);

  const header = `
    <h2>Auction: ${esc(card.name)}</h2>
    <div class="desc">Original owner: ${esc(owner.name)}. The winner pays their bid directly to the owner.</div>
    <div class="row" style="justify-content:center; margin-bottom:12px;">${renderCardBig(card)}</div>
    <div class="auction-steps">
      <span class="astep ${m.phase === 'freeze' ? 'on' : 'done'}">1 &middot; Freeze window</span>
      <span class="astep-sep">&rarr;</span>
      <span class="astep ${m.phase === 'bidding' ? 'on' : ''}">2 &middot; Bidding (seat order)</span>
    </div>`;

  // ---- PHASE 1: freeze window ----
  if (m.phase === 'freeze') {
    const chooserId = currentFreezeChooser(m);
    if (chooserId == null) { m.phase = 'bidding'; m.turnIdx = 0; }
    else {
      const chooser = G.players.find(p => p.id === chooserId);
      const targets = m.remaining.filter(id => id !== chooserId);
      const queuePos = `${m.freezeIdx + 1} of ${m.freezeQueue.length}`;
      if (chooser.isAI) {
        return modalWrap(`${header}
          <div class="auction-turn ai">&#129302; ${esc(chooser.name)} is deciding whether to use Freeze Auction... <span style="color:var(--ink-dim);">(${queuePos})</span></div>`);
      }
      return modalWrap(`${header}
        <div class="auction-turn">&#10052;&#65039; ${esc(chooser.name)} &mdash; use your Freeze Auction? <span style="color:var(--ink-dim);">(${queuePos})</span></div>
        <div class="desc" style="text-align:center;">Freezing a player blocks them from bidding on this card entirely. Humans are offered this first, then the robots.</div>
        <div class="row" style="justify-content:center; flex-wrap:wrap; gap:8px;">
          <select id="freezeTarget_${chooserId}" style="padding:7px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink);">
            ${targets.map(id => `<option value="${id}">${esc(G.players.find(p => p.id === id).name)}</option>`).join('')}
          </select>
          <button class="btn btn-danger" onclick="freezePlayerInAuction(${chooserId}, parseInt(document.getElementById('freezeTarget_${chooserId}').value))">Freeze them out</button>
          <button class="btn btn-primary" onclick="skipFreeze(${chooserId})">Don't freeze &mdash; continue</button>
        </div>`);
    }
  }

  // ---- PHASE 2: sequential bidding ----
  const bidderId = currentBidder(m);
  const standings = `
    <div style="text-align:center; margin-bottom:12px; font-size:15px;">
      Highest bid: <b style="color:var(--accent);">${m.highestBid} coins</b>
      ${m.highestBidderId != null ? `by <b>${esc(G.players.find(p => p.id === m.highestBidderId).name)}</b>` : '<span style="color:var(--ink-dim);">(no bids yet)</span>'}
    </div>
    <div class="bid-order">
      ${m.bidOrder.map(id => {
        const pl = G.players.find(p => p.id === id);
        const out = !m.remaining.includes(id);
        const isHigh = m.highestBidderId === id;
        const isNow = bidderId === id;
        return `<div class="bid-seat ${out ? 'out' : ''} ${isNow ? 'now' : ''} ${isHigh ? 'high' : ''}">
          <span class="seat-num">${m.bidOrder.indexOf(id) + 1}</span>
          <span>${esc(pl.name)}</span>
          <span style="color:var(--ink-dim);">${pl.bank}c</span>
          ${isHigh ? '<span class="tag-pill" style="color:var(--accent); border-color:var(--accent);">high</span>' : ''}
          ${out ? '<span class="tag-pill">out</span>' : ''}
          ${pl.doubleBidArmed ? '<span class="tag-pill" style="color:#e86a9b; border-color:#e86a9b;">2&times;</span>' : ''}
        </div>`;
      }).join('')}
    </div>`;

  if (bidderId == null) return modalWrap(`${header}${standings}<div class="auction-turn">Resolving...</div>`);

  const bidder = G.players.find(p => p.id === bidderId);
  const minBid = m.highestBid + 1;
  if (bidder.isAI) {
    return modalWrap(`${header}${standings}
      <div class="auction-turn ai">&#129302; ${esc(bidder.name)} is thinking about their bid...</div>`);
  }
  const canAfford = bidder.bank >= minBid;
  return modalWrap(`${header}${standings}
    <div class="auction-turn">&#128176; ${esc(bidder.name)}'s turn to bid</div>
    <div class="row" style="justify-content:center; flex-wrap:wrap; gap:8px;">
      <input type="number" min="${minBid}" max="${bidder.bank}" id="bidamt_${bidderId}" placeholder="min ${minBid}"
        style="width:100px; padding:7px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink);" />
      <button class="btn btn-primary" ${canAfford ? '' : 'disabled'} onclick="placeBid(${bidderId}, document.getElementById('bidamt_${bidderId}').value)">Bid</button>
      <button class="btn" onclick="passAuction(${bidderId})">Pass (drop out)</button>
    </div>
    <div class="desc" style="text-align:center; margin-top:8px;">
      ${canAfford ? `Must bid at least ${minBid}. You have ${bidder.bank} coins.` : `You can't reach ${minBid} coins — passing is your only option.`}
      ${bidder.doubleBidArmed ? '<br><b style="color:#e86a9b;">Double Bid armed: your bid counts double.</b>' : ''}
    </div>`);
}

function placeBid(playerId, rawAmount) {
  const m = G.modal;
  const player = G.players.find(p => p.id === playerId);
  const amount = parseInt(rawAmount, 10);
  const minBid = m.highestBid + 1;
  if (!amount || amount < minBid) { if (!player.isAI) alert(`Bid must be at least ${minBid} coins.`); return; }
  if (amount > player.bank) { if (!player.isAI) alert(`${player.name} only has ${player.bank} coins.`); return; }
  const effective = player.doubleBidArmed ? amount * 2 : amount;
  if (effective <= m.highestEffective) { if (!player.isAI) alert('That bid does not beat the current highest.'); return; }
  m.highestBid = amount;
  m.highestEffective = effective;
  m.highestBidderId = playerId;
  if (player.doubleBidArmed) {
    notify(G, `${player.name}'s Double Bid kicked in — this bid counts as ${effective}!`, 'wild');
    player.doubleBidArmed = false;
  }
  logHistory(G, `${player.name} bid ${amount} coins.`, 'auction');
  if (auctionActionsRemaining(m).length === 0) { resolveAuctionEnd(); return; }
  // The new high bidder drops out of the active order, which already shifts the next
  // seat into this index — so we must NOT advance again or we'd skip a player.
  const order = m.bidOrder.filter(id => auctionActionsRemaining(m).includes(id));
  if (m.turnIdx >= order.length) m.turnIdx = 0;
  render();
}

function passAuction(playerId) {
  const m = G.modal;
  const pl = G.players.find(p => p.id === playerId);
  logHistory(G, `${pl.name} passed.`, 'auction');
  const order = m.bidOrder.filter(id => auctionActionsRemaining(m).includes(id));
  const wasIdx = order.indexOf(playerId);
  m.remaining = m.remaining.filter(id => id !== playerId);
  if (auctionActionsRemaining(m).length === 0) { resolveAuctionEnd(); return; }
  // Keep the pointer where the dropped player was, so the next seat acts.
  const newOrder = m.bidOrder.filter(id => auctionActionsRemaining(m).includes(id));
  m.turnIdx = wasIdx >= newOrder.length ? 0 : wasIdx;
  render();
}

function freezePlayerInAuction(usingPlayerId, targetId) {
  const m = G.modal;
  const user = G.players.find(p => p.id === usingPlayerId);
  const idx = user.heldWildcards.findIndex(w => w.type === 'FREEZE');
  if (idx === -1) return;
  user.heldWildcards.splice(idx, 1);
  m.remaining = m.remaining.filter(id => id !== targetId);
  notify(G, `${user.name} used Freeze Auction on ${G.players.find(p => p.id === targetId).name}!`, 'wild');
  if (auctionActionsRemaining(m).length === 0) { resolveAuctionEnd(); return; }
  advanceFreezePhase();
}

function maybeEndAuction() {
  const m = G.modal;
  if (auctionActionsRemaining(m).length === 0) resolveAuctionEnd();
  else render();
}

function resolveAuctionEnd() {
  const m = G.modal;
  const owner = G.players.find(p => p.id === m.ownerId);
  const card = owner.floor.find(c => c.uid === m.cardUid);
  if (m.highestBidderId != null) {
    const winner = G.players.find(p => p.id === m.highestBidderId);
    winner.bank -= m.highestBid;
    owner.bank += m.highestBid;
    removeCharFromFloor(owner, m.cardUid);
    winner.floor.push(card);
    notify(G, `${winner.name} won the auction for ${card.name} — paid ${m.highestBid} coins to ${owner.name}.`, 'auction');
  } else {
    notify(G, `No bids — ${card.name} stays with ${owner.name}.`, 'auction');
  }
  G.modal = null;
  render();
}

// --- Shop ---

function openShopPrivacy() {
  const p = activePlayer(G);
  const picks = [];
  for (let i = 0; i < 5 && G.characterDeck.length > 0; i++) picks.push(drawCharacterCard(G));
  G.modal = { type: 'shop', stage: 'gate', forPlayerId: p.id, options: picks };
  render();
}

function renderShopModal() {
  const m = G.modal;
  const p = G.players.find(pl => pl.id === m.forPlayerId);
  if (m.stage === 'gate') {
    return modalWrap(`
      <div class="privacy-wrap">
        <div class="eye">&#128065;</div>
        <h2>Pass the device to ${esc(p.name)}</h2>
        <div class="desc">Only ${esc(p.name)} should see the next screen — it's a private Shop peek.</div>
        <button class="btn btn-primary" onclick="revealShop()">I'm ${esc(p.name)} — Reveal My Options</button>
      </div>
    `);
  }
  return modalWrap(`
    <h2>Shop — pick 1 (bank: ${p.bank} coins)</h2>
    <div class="desc">The other 4 reshuffle back into the deck.</div>
    <div class="floor">
      ${m.options.map(c => {
        const cost = RARITY[c.rarity].value;
        const afford = p.bank >= cost;
        return `<div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
          ${renderCardMini(c)}
          <button class="btn btn-sm ${afford ? 'btn-primary' : ''}" ${afford ? '' : 'disabled'} onclick="buyShopCard(${c.uid})">Buy for ${cost}</button>
        </div>`;
      }).join('')}
    </div>
    <div class="row" style="margin-top:14px;">
      <button class="btn" onclick="skipShop()">Skip — buy nothing</button>
    </div>
  `);
}

function revealShop() {
  G.modal.stage = 'reveal';
  render();
}

function buyShopCard(uid) {
  const m = G.modal;
  const p = G.players.find(pl => pl.id === m.forPlayerId);
  const card = m.options.find(c => c.uid === uid);
  const cost = RARITY[card.rarity].value;
  if (p.bank < cost) { alert('Not enough coins.'); return; }
  p.bank -= cost;
  p.floor.push(card);
  const rest = m.options.filter(c => c.uid !== uid);
  G.characterDeck = shuffle(G.characterDeck.concat(rest));
  notify(G, `${p.name} bought ${card.name} from the Shop for ${cost} coins.`);
  G.modal = null;
  render();
}

function skipShop() {
  const m = G.modal;
  G.characterDeck = shuffle(G.characterDeck.concat(m.options));
  G.modal = null;
  render();
}

    <div style="margin-bottom:12px;">

      <div style="margin-bottom:12px;">
        <div style="font-size:12.5px; color:var(--ink-dim); margin-bottom:4px;">${esc(p.name)}'s floor</div>
        <div class="floor">${p.floor.map(c => renderCardMini(c, { selectable: true, selected: m.theirUid === c.uid, onclick: `selectSwapTheirs(${p.id}, ${c.uid})` })).join('')}</div>
      </div>
    `).join('')}
    <div class="row">
      <button class="btn btn-primary" ${(m.myUid == null || m.theirUid == null) ? 'disabled' : ''} onclick="confirmSwap()">Confirm Swap</button>
      <button class="btn" onclick="closeModalFizzle()">Cancel (card is wasted)</button>
    </div>
  `);
}

function selectSwapMine(uid) { G.modal.myUid = uid; render(); }
function selectSwapTheirs(ownerId, uid) { G.modal.theirOwnerId = ownerId; G.modal.theirUid = uid; render(); }

function confirmSwap() {
  const m = G.modal;
  if (m.myUid == null || m.theirUid == null) return;
  const me = activePlayer(G);
  const themId = m.theirOwnerId;
  const myUid = m.myUid;
  const theirUid = m.theirUid;
  offerCancelOrProceed(themId, 'swap', () => executeSwap(me.id, themId, myUid, theirUid));
}

function executeSwap(meId, themId, myUid, theirUid) {
  const me = G.players.find(p => p.id === meId);
  const them = G.players.find(p => p.id === themId);
  const mineCard = removeCharFromFloor(me, myUid);
  const theirCard = removeCharFromFloor(them, theirUid);
  me.floor.push(theirCard);
  them.floor.push(mineCard);
  notify(G, `${me.name} swapped ${mineCard.name} for ${them.name}'s ${theirCard.name}.`);
  G.modal = null;
  render();
}

// --- Steal ---

function renderStealModal() {
  const m = G.modal;
  const me = activePlayer(G);
  const tier = m.stealTier;
  const opponents = G.players.filter(p => p.id !== me.id && p.floor.some(c => c.rarity === tier));
  if (m.stealOwnerId == null) {
    return modalWrap(`
      <h2>${esc(m.stealLabel || 'Steal Card')}</h2>
      <div class="desc">${esc(me.name)} may take one <b style="color:${RARITY[tier].color};">${esc(tier)}</b> character for free. Choose which opponent to take it from.</div>
      <div class="row">
        ${opponents.map(p => {
          const n = p.floor.filter(c => c.rarity === tier).length;
          return `<button class="btn" onclick="chooseStealTarget(${p.id})">${esc(p.name)} <small style="opacity:.7;">(${n} ${esc(tier)})</small></button>`;
        }).join('')}
      </div>
      <div class="row" style="margin-top:10px;"><button class="btn" onclick="closeModalFizzle()">Cancel (card is wasted)</button></div>
    `);
  }
  const owner = G.players.find(p => p.id === m.stealOwnerId);
  const candidates = owner.floor.filter(c => c.rarity === tier);
  return modalWrap(`
    <h2>Steal a ${esc(tier)} from ${esc(owner.name)}</h2>
    <div class="desc">Pick which <b style="color:${RARITY[tier].color};">${esc(tier)}</b> card to take.</div>
    <div class="floor">${candidates.map(c => renderCardMini(c, { selectable: true, onclick: `confirmSteal(${c.uid})` })).join('')}</div>
    <div class="row" style="margin-top:10px;"><button class="btn" onclick="closeModalFizzle()">Cancel (card is wasted)</button></div>
  `);
}

function chooseStealTarget(ownerId) { G.modal.stealOwnerId = ownerId; render(); }

function confirmSteal(uid) {
  const me = activePlayer(G);
  const ownerId = G.modal.stealOwnerId;
  offerCancelOrProceed(ownerId, 'steal', () => executeSteal(me.id, ownerId, uid));
}

function executeSteal(stealerId, ownerId, uid) {
  const me = G.players.find(p => p.id === stealerId);
  const owner = G.players.find(p => p.id === ownerId);
  const card = removeCharFromFloor(owner, uid);
  me.floor.push(card);
  notify(G, `${me.name} stole ${card.name} (${card.rarity}) from ${owner.name} for free!`, 'wild');
  G.modal = null;
  render();
}

function closeModalFizzle() {
  G.modal = null;
  notify(G, 'Wildcard discarded with no effect.');
  render();
}

// ====== DISCARD-DOWN SCREEN ======

function renderDiscard() {
  const pid = G.discardQueue[0];
  const p = G.players.find(pl => pl.id === pid);
  const need = p.floor.length - 10;
  const sel = G.discardSelection || [];
  return `
  <div class="topbar">
    <div>
      <div class="title">Trim ${esc(p.name)}'s Floor</div>
      <div class="subtitle">${esc(p.name)} has ${p.floor.length} characters — choose ${need} to discard (down to 10)</div>
    </div>
  </div>
  <div class="panel">
    <div class="floor">
      ${p.floor.map(c => renderCardMini(c, { selectable: true, selected: sel.includes(c.uid), onclick: `toggleDiscardSelect(${c.uid})` })).join('')}
    </div>
    <div class="row" style="margin-top:14px;">
      <button class="btn btn-primary" ${sel.length === need ? '' : 'disabled'} onclick="confirmDiscard()">Confirm Discard (${sel.length}/${need})</button>
    </div>
  </div>
  ${G.discardPile.length ? `<div class="panel"><h3 style="font-size:13px;">Discard Pile</h3><div class="floor">${G.discardPile.map(c => renderCardMini(c)).join('')}</div></div>` : ''}
  `;
}

function toggleDiscardSelect(uid) {
  G.discardSelection = G.discardSelection || [];
  const p = G.players.find(pl => pl.id === G.discardQueue[0]);
  const need = p.floor.length - 10;
  const i = G.discardSelection.indexOf(uid);
  if (i > -1) { G.discardSelection.splice(i, 1); }
  else {
    if (G.discardSelection.length >= need) return;
    G.discardSelection.push(uid);
  }
  render();
}

function confirmDiscard() {
  const p = G.players.find(pl => pl.id === G.discardQueue[0]);
  const sel = G.discardSelection || [];
  sel.forEach(uid => { const c = removeCharFromFloor(p, uid); if (c) G.discardPile.push(c); });
  G.discardSelection = [];
  G.discardQueue.shift();
  if (G.discardQueue.length === 0) { beginAttackPhase(); return; }
  render();
}

// ====== ATTACK PHASE ======

function beginAttackPhase() {
  G.notifications = [];
  G.players.forEach(p => {
    const bonuses = applySetBonuses(G, p);
    bonuses.forEach(b => notify(G, b));
  });
  G.bracket = buildBracket(G.players);
  G.attackUI = { stage: 'bracket' };
  G.screen = 'attack';
  render();
}

function renderAttack() {
  const ui = G.attackUI;
  if (ui.stage === 'bracket') return renderBracketScreen();
  if (ui.stage === 'privacy') return renderMatchupPrivacyGate();
  if (ui.stage === 'reveal') return renderMatchupReveal();
  if (ui.stage === 'duel-result') return renderDuelResult();
  if (ui.stage === 'match-over') return renderMatchOver();
  if (ui.stage === 'gameover') return renderGameOver();
  return '';
}

function renderBracketScreen() {
  const b = G.bracket;
  const rounds = [{ round: 1, matches: b.round === 1 ? b.currentMatches : null }];
  // We only keep the live current round in state; show it plus history via matchLog text.
  const pName = id => id == null ? 'Bye' : G.players.find(p => p.id === id).name;
  const matchesHtml = b.currentMatches.map((m, i) => {
    const isNext = i === b.matchIndex && !b.finished;
    const done = m.winner != null && i < b.matchIndex;
    return `<div class="bracket-match" style="${isNext ? 'border-color:var(--accent);' : ''}">
      <div>${esc(pName(m.p1))}</div>
      <div class="vs">vs</div>
      <div>${esc(pName(m.p2))}</div>
      ${m.winner != null ? `<div class="winner">Winner: ${esc(pName(m.winner))}</div>` : ''}
    </div>`;
  }).join('');

  let actionBtn = '';
  if (b.finished) {
    actionBtn = `<button class="btn btn-primary" onclick="G.attackUI.stage='gameover'; render();">See Final Result</button>`;
  } else {
    const m = currentMatch(b);
    if (m.p2 === null) {
      actionBtn = `<button class="btn btn-primary" onclick="resolveByeMatch()">Advance ${esc(pName(m.p1))} (Bye)</button>`;
    } else {
      actionBtn = `<button class="btn btn-primary" onclick="startMatchup(${m.p1}, ${m.p2})">Start Match: ${esc(pName(m.p1))} vs ${esc(pName(m.p2))}</button>`;
    }
  }

  return `
  <div class="topbar">
    <div>
      <div class="title">Anime Alliance — Attack Phase</div>
      <div class="subtitle">Round ${b.round} of the bracket</div>
    </div>
    <span class="helpicon" onclick="alert('Teams duel character-by-character. Each duel: Initiative (Speed + a random roll) decides who acts first, then fighters alternate turns choosing Basic Attack, Special Attack, a Legendary Attack (Legendaries only, once Ultimate Energy hits 100), or Block. Damage scales off Attack/Power (basic) or Special Attack/Power/Mana (special), reduced by the defender\\\\'s Defense; blocking cuts incoming damage by 60% and can trigger a Counter. Specials cost Mana Pool (separate from the Mana stat) and Epic/Legendary specials can carry a status effect like Burn, Stun, or Freeze. When a fighter is knocked out, the losing side sends in their next character (relay-style) until one whole team is defeated.')">how combat works</span>
  </div>
  <div class="panel">
    <div class="bracket">
      <div class="bracket-round"><h4>Round ${b.round}</h4>${matchesHtml}</div>
    </div>
    <div style="margin-top:14px;">${actionBtn}</div>
  </div>
  ${G.players.map(pl => renderTeamPanel(pl)).join('')}
  `;
}

function renderTeamPanel(pl) {
  return `<div class="player-panel ${pl.eliminated ? 'is-eliminated' : ''}">
    <div class="player-head">
      <div class="player-name">${esc(pl.name)}</div>
      ${pl.isAI ? '<span class="player-badge" style="border-color:var(--accent); color:var(--accent);">&#129302; AI</span>' : ''}
      ${pl.eliminated ? '<span class="player-badge">Eliminated</span>' : '<span class="player-badge">In the running</span>'}
    </div>
    <div class="team-strength">&#127942; Total Team Strength: <b>${teamStrength(pl.floor).toLocaleString()}</b></div>
    <div class="floor">${pl.floor.map(c => renderCardMini({ ...c, hp: c.maxHp })).join('')}</div>
  </div>`;
}

function resolveByeMatch() {
  const b = G.bracket;
  const m = currentMatch(b);
  advanceBracketAfterMatch(b, m.p1);
  notify(G, `${G.players.find(p => p.id === m.p1).name} advances on a bye.`);
  render();
}

function startMatchup(idA, idB) {
  const pa = G.players.find(p => p.id === idA);
  const pb = G.players.find(p => p.id === idB);
  G.attackUI.matchup = createMatchup(pa, pb);
  G.attackUI.stage = 'privacy';
  G.attackUI.privacy = { forPlayerId: idA, purpose: 'initial-A', revealed: false };
  render();
}

// --- Privacy gate + pick ---

function renderMatchupPrivacyGate() {
  const pr = G.attackUI.privacy;
  const p = G.players.find(pl => pl.id === pr.forPlayerId);
  if (!pr.revealed) {
    return `<div class="topbar"><div class="title">Attack Phase</div></div>
    <div class="panel privacy-wrap">
      <div class="eye">&#128065;</div>
      <h2>Pass the device to ${esc(p.name)}</h2>
      <div class="desc">Only ${esc(p.name)} should look at the next screen — you'll secretly choose your fighter.</div>
      <button class="btn btn-primary" onclick="revealPick()">I'm ${esc(p.name)} — Reveal My Pick Screen</button>
    </div>`;
  }
  const m = G.attackUI.matchup;
  const side = (pr.purpose === 'initial-A' || pr.purpose === 'relay-A') ? 'A' : 'B';
  const pool = side === 'A' ? m.poolA : m.poolB;
  return `<div class="topbar"><div class="title">${esc(p.name)}, choose your fighter</div></div>
  <div class="panel">
    <div class="floor">${pool.map(c => renderCardMini(c, { selectable: true, onclick: `confirmPick('${side}', ${c.uid})` })).join('')}</div>
  </div>`;
}

function revealPick() {
  G.attackUI.privacy.revealed = true;
  render();
}

function confirmPick(side, uid) {
  const m = G.attackUI.matchup;
  pickActive(m, side, uid);
  const purpose = G.attackUI.privacy.purpose;
  if (purpose === 'initial-A') {
    G.attackUI.privacy = { forPlayerId: m.playerBId, purpose: 'initial-B', revealed: false };
    G.attackUI.stage = 'privacy';
  } else {
    // initial-B, relay-A, or relay-B all lead straight to the live duel
    beginEncounterTurnOrder(m);
    G.attackUI.stage = 'reveal';
  }
  render();
}

// --- Reveal + fight ---

function renderMatchupReveal() {
  const m = G.attackUI.matchup;
  const pa = G.players.find(p => p.id === m.playerAId);
  const pb = G.players.find(p => p.id === m.playerBId);
  const turnSide = m.turn;
  const turnPlayer = turnSide === 'A' ? pa : pb;
  const turnFighter = turnSide === 'A' ? m.activeA : m.activeB;
  const isHumanTurn = !turnPlayer.isAI;

  const specialCost = SPECIAL_MANA_COST[turnFighter.rarity] || 25;
  const availSpecial = canUseSpecial(turnFighter) && turnFighter.manaPool >= specialCost;
  const availLegendary = turnFighter.rarity === 'Legendary' && turnFighter.ultimateEnergy >= 100 && turnFighter.manaPool >= LEGENDARY_MANA_COST;

  const actionsHtml = isHumanTurn ? `
    <div class="row" style="justify-content:center; gap:8px; flex-wrap:wrap; margin-top:12px;">
      <button class="btn btn-primary" onclick="netResolveTurn('basic')">&#9876;&#65039; ${esc(basicMoveName(turnFighter))}</button>
      <button class="btn move-btn" ${availSpecial ? '' : 'disabled'} onclick="netResolveTurn('special')" title="${esc(specialMoveName(turnFighter))}">&#128293; ${esc(specialMoveName(turnFighter))}<small>${specialCost} MP</small></button>
      ${turnFighter.rarity === 'Legendary' ? `<button class="btn move-btn legendary-btn" ${availLegendary ? '' : 'disabled'} onclick="netResolveTurn('legendary')" title="${esc(legendaryMoveName(turnFighter))}">&#128081; ${esc(legendaryMoveName(turnFighter))}<small>${LEGENDARY_MANA_COST} MP &middot; ${turnFighter.ultimateEnergy}/100 UE</small></button>` : ''}
      <button class="btn" onclick="netResolveTurn('block')">&#128737;&#65039; Block</button>
    </div>` : `<div style="text-align:center; margin-top:12px; color:var(--ink-dim);">&#129302; ${esc(turnPlayer.name)}'s fighter is deciding...</div>`;

  return `<div class="topbar"><div class="title">Duel!</div><div class="subtitle">${esc(pa.name)} vs ${esc(pb.name)} &middot; ${esc(turnFighter.name)}'s turn</div></div>
  <div class="panel">
    <div class="duel-arena">
      ${renderDuelFighter(m.activeA, pa, turnSide === 'A', 'A', isHumanTurn && turnSide !== 'A')}
      <div class="duel-vs">VS</div>
      ${renderDuelFighter(m.activeB, pb, turnSide === 'B', 'B', isHumanTurn && turnSide !== 'B')}
    </div>
    ${actionsHtml}
    <div class="log-panel" style="margin-top:12px;">${(m.log || []).slice(-8).map(l => `<div>${esc(l)}</div>`).join('')}</div>
  </div>`;
}

// Live combat card for the duel screen: the base card plus Mana Pool / Ultimate Energy
// bars and any active status badges, on top of the usual HP bar.
function renderDuelFighter(c, player, isTurn, side, conceal) {
  const hpPct = Math.max(0, Math.round((c.hp / c.maxHp) * 100));
  const uePct = c.ultimateEnergy || 0;
  const badges = [];
  if (c.burnTurns > 0) badges.push('&#128293; Burn');
  if (c.bleedTurns > 0) badges.push('&#129400; Bleed');
  if (c.poisonTurns > 0) badges.push('&#9760;&#65039; Poison');
  if (c.defenseBreakTurns > 0) badges.push('&#128162; Def Break');
  if (c.attackBoostTurns > 0) badges.push('&#128170; Atk Boost');
  if (c.frozen) badges.push('&#10052;&#65039; Frozen');
  if (c.blockActive) badges.push('&#128737;&#65039; Blocking');
  const specialCost = SPECIAL_MANA_COST[c.rarity] || 25;
  const manaPct = clampNum(Math.round((c.manaPool / 100) * 100), 0, 100);
  const canAffordSpecial = c.specialAttack > 0 && c.manaPool >= specialCost;
  const ultReady = uePct >= 100;
  return `<div class="center-col duel-fighter" id="fighter-${side}" style="${isTurn ? 'outline:2px solid var(--accent); border-radius:12px; padding:6px;' : 'padding:6px;'}">
    ${renderCardBig(c, conceal)}
    <div style="margin-top:4px; font-weight:600;">${esc(player.name)}</div>

    <div class="meter-block">
      <div class="meter-row">
        <span class="meter-label">&#128167; MANA</span>
        <span class="meter-val" style="color:${canAffordSpecial ? '#5ab0f5' : 'var(--ink-dim)'};">${c.manaPool}${c.specialAttack > 0 ? ` / ${specialCost}` : ''}</span>
      </div>
      <div class="meter-bar"><div class="meter-fill" style="width:${manaPct}%; background:linear-gradient(90deg,#3d8fd6,#5ab0f5);"></div>
        ${c.specialAttack > 0 && specialCost <= 100 ? `<div class="meter-marker" style="left:${specialCost}%;" title="Special costs ${specialCost}"></div>` : ''}
      </div>
      <div class="meter-sub">${c.specialAttack > 0 ? (canAffordSpecial ? '&#9889; Special ready' : `Need ${specialCost - c.manaPool} more for Special`) : 'No Special Attack'}</div>

      ${c.rarity === 'Legendary' ? `
        <div class="meter-row" style="margin-top:7px;">
          <span class="meter-label" style="color:${ultReady ? 'var(--accent)' : 'var(--ink-dim)'};">&#128081; ULTIMATE</span>
          <span class="meter-val" style="color:${ultReady ? 'var(--accent)' : 'var(--ink-dim)'};">${uePct} / 100</span>
        </div>
        <div class="meter-bar${ultReady ? ' ult-ready' : ''}"><div class="meter-fill" style="width:${uePct}%; background:linear-gradient(90deg,#c08a1e,#ffd34d);"></div></div>
        <div class="meter-sub" style="${ultReady ? 'color:var(--accent); font-weight:700;' : ''}">${ultReady ? '&#9733; ULTIMATE READY' : `Charging \u2014 ${100 - uePct} to go`}</div>` : ''}
    </div>

    ${badges.length ? `<div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:3px; justify-content:center;">${badges.map(b => `<span class="tag-pill">${b}</span>`).join('')}</div>` : ''}
  </div>`;
}

function renderDuelResult() {
  const m = G.attackUI.matchup;
  const pa = G.players.find(p => p.id === m.playerAId);
  const pb = G.players.find(p => p.id === m.playerBId);
  const logTail = m.log.slice(-8);
  let actionBtn = '';
  const state = G.attackUI.lastState;
  if (state === 'relay-a') actionBtn = `<button class="btn btn-primary" onclick="beginRelay('A')">${esc(pa.name)}, pick your next fighter</button>`;
  else if (state === 'relay-b') actionBtn = `<button class="btn btn-primary" onclick="beginRelay('B')">${esc(pb.name)}, pick your next fighter</button>`;
  else actionBtn = `<button class="btn btn-primary" onclick="G.attackUI.stage='match-over'; render();">Continue</button>`;

  return `<div class="topbar"><div class="title">Round Result</div></div>
  <div class="panel">
    <div class="duel-arena">
      <div class="center-col">${m.activeA ? renderCardBig(m.activeA) : `<div class="card big dead" style="display:flex;align-items:center;justify-content:center;">Defeated</div>`}<div>${esc(pa.name)}</div></div>
      <div class="duel-vs">VS</div>
      <div class="center-col">${m.activeB ? renderCardBig(m.activeB) : `<div class="card big dead" style="display:flex;align-items:center;justify-content:center;">Defeated</div>`}<div>${esc(pb.name)}</div></div>
    </div>
    <div class="log-panel">${logTail.map(l => `<div>${esc(l)}</div>`).join('')}</div>
    <div style="text-align:center; margin-top:14px;">${actionBtn}</div>
  </div>`;
}

function beginRelay(side) {
  const m = G.attackUI.matchup;
  const forId = side === 'A' ? m.playerAId : m.playerBId;
  G.attackUI.privacy = { forPlayerId: forId, purpose: side === 'A' ? 'relay-A' : 'relay-B', revealed: false };
  G.attackUI.stage = 'privacy';
  render();
}

function renderMatchOver() {
  const m = G.attackUI.matchup;
  const winner = G.players.find(p => p.id === m.winnerId);
  const loser = G.players.find(p => p.id === (m.winnerId === m.playerAId ? m.playerBId : m.playerAId));
  return `<div class="topbar"><div class="title">Match Over</div></div>
  <div class="panel center-col">
    <h2>${esc(winner.name)} wins the match!</h2>
    <div style="color:var(--ink-dim);">${esc(loser.name)} is eliminated from the tournament.</div>
    <button class="btn btn-primary" onclick="finishMatchup()">Advance Bracket</button>
  </div>`;
}

function finishMatchup() {
  const m = G.attackUI.matchup;
  const loserId = m.winnerId === m.playerAId ? m.playerBId : m.playerAId;
  G.players.find(p => p.id === loserId).eliminated = true;
  advanceBracketAfterMatch(G.bracket, m.winnerId);
  G.attackUI = { stage: G.bracket.finished ? 'gameover' : 'bracket' };
  render();
}

function renderGameOver() {
  const winner = G.players.find(p => p.id === G.bracket.winnerId);
  return `<div class="topbar"><div class="title">Anime Alliance</div></div>
  <div class="panel center-col" style="padding:50px 20px;">
    <h1 style="font-size:34px;">${esc(winner.name)} wins Anime Alliance!</h1>
    <div class="floor" style="justify-content:center; margin-top:16px;">${winner.floor.map(c => renderCardMini({ ...c, hp: c.maxHp })).join('')}</div>
    <button class="btn btn-primary" style="margin-top:24px;" onclick="location.reload()">Play Again</button>
  </div>`;
}

</script>
<script>
// ====== AI ENGINE (Single Player mode) ======
// Any player flagged isAI plays itself: draws, decides on wildcards, bids in
// auctions, picks fighters, etc. Driven by a short timer loop that re-arms itself
// every render() so the game keeps advancing on its own whenever it's an AI's turn,
// and simply idles whenever a human needs to make the next move.

const AI_THINK_MS = 700;

function scheduleAI() {
  if (!G || G.screen === 'setup') return;
  if (Net.mode === 'client') return; // the host is authoritative and runs all AI turns
  if (window.__aiTimer) clearTimeout(window.__aiTimer);
  window.__aiTimer = setTimeout(function () {
    G._aiActing = true;
    try { aiStep(); } catch (e) { console.error('AI step failed:', e); }
    finally { G._aiActing = false; }
  }, AI_THINK_MS);
}

function aiStep() {
  if (!G) return;
  if (G.screen === 'draft') return aiStepDraft();
  if (G.screen === 'discard') return aiStepDiscard();
  if (G.screen === 'attack') return aiStepAttack();
}

function aiCardScore(c) {
  return RARITY[c.rarity].value * 10 + c.power + c.attack + c.defense + c.specialAttack;
}

// --- Draft phase ---

function aiStepDraft() {
  const p = activePlayer(G);
  if (G.modal) {
    const t = G.modal.type;
    if (t === 'cancelPrompt') {
      const target = G.players.find(pl => pl.id === G.modal.targetPlayerId);
      if (target.isAI) resolveCancelPrompt(Math.random() < 0.55);
      return;
    }
    if (t === 'wildcardChoice') {
      if (!p.isAI) return;
      if (G.modal.wtype === 'FREEZE') { chooseWildcard('hold'); return; }
      chooseWildcard(Math.random() < 0.85 ? 'now' : 'hold');
      return;
    }
    if (t === 'auctionSetup') { if (p.isAI) aiRunAuctionSetup(p); return; }
    if (t === 'auction') { aiRunAuctionBidding(); return; }
    if (t === 'shop') { aiRunShop(); return; }
    if (t === 'swap') { if (p.isAI) aiRunSwap(p); return; }
    if (t === 'steal') { if (p.isAI) aiRunSteal(p); return; }
    return;
  }
  if (!p.isAI) return;
  if (G.draftStage !== 'drawn') { drawCardsForTurn(); return; }
  endTurn();
}

function aiRunAuctionSetup(p) {
  const opponents = G.players.filter(pl => pl.id !== p.id && pl.floor.length > 0);
  let best = null;
  opponents.forEach(op => {
    op.floor.forEach(c => {
      const val = aiCardScore(c);
      if (!best || val > best.val) best = { ownerId: op.id, uid: c.uid, val };
    });
  });
  if (!best) { closeModalFizzle(); return; }
  G.modal.selectedOwnerId = best.ownerId;
  G.modal.selectedCardUid = best.uid;
  confirmStartAuction();
}

function aiRunAuctionBidding() {
  const m = G.modal;
  const owner = G.players.find(pl => pl.id === m.ownerId);
  const card = owner.floor.find(c => c.uid === m.cardUid);

  // Phase 1 — this AI's turn in the freeze queue (humans have already had theirs).
  if (m.phase === 'freeze') {
    const chooserId = currentFreezeChooser(m);
    if (chooserId == null) { m.phase = 'bidding'; m.turnIdx = 0; render(); return; }
    const chooser = G.players.find(pl => pl.id === chooserId);
    if (!chooser.isAI) return; // waiting on a human's freeze decision
    const targets = m.remaining.filter(id => id !== chooserId);
    // Freeze the richest rival, but only for a card actually worth contesting.
    if (targets.length && RARITY[card.rarity].value >= 25 && Math.random() < 0.6) {
      const richest = targets.map(id => G.players.find(p => p.id === id)).sort((a, b) => b.bank - a.bank)[0];
      freezePlayerInAuction(chooserId, richest.id);
    } else {
      skipFreeze(chooserId);
    }
    return;
  }

  // Phase 2 — only act when it is genuinely this AI's turn in seat order.
  const bidderId = currentBidder(m);
  if (bidderId == null) return;
  const player = G.players.find(pl => pl.id === bidderId);
  if (!player.isAI) return; // a human is on the clock
  const value = RARITY[card.rarity].value;
  const willingToPay = Math.min(player.bank, Math.round(value * (0.5 + Math.random() * 0.9)));
  const nextBid = m.highestBid + randInt(1, 3);
  if (nextBid <= willingToPay && nextBid <= player.bank) placeBid(player.id, nextBid);
  else passAuction(player.id);
}

function aiRunShop() {
  const m = G.modal;
  const p = G.players.find(pl => pl.id === m.forPlayerId);
  if (!p.isAI) return;
  if (m.stage === 'gate') { revealShop(); return; }
  let best = null;
  m.options.forEach(c => {
    const cost = RARITY[c.rarity].value;
    if (p.bank >= cost && (!best || aiCardScore(c) > best.val)) best = { uid: c.uid, val: aiCardScore(c) };
  });
  if (best) buyShopCard(best.uid); else skipShop();
}

function aiRunSwap(p) {
  const opponents = G.players.filter(pl => pl.id !== p.id && pl.floor.length > 0);
  if (opponents.length === 0 || p.floor.length === 0) { closeModalFizzle(); return; }
  const myWorst = p.floor.slice().sort((a, b) => aiCardScore(a) - aiCardScore(b))[0];
  let bestTarget = null;
  opponents.forEach(op => {
    op.floor.forEach(c => {
      const val = aiCardScore(c);
      if (!bestTarget || val > bestTarget.val) bestTarget = { ownerId: op.id, uid: c.uid, val };
    });
  });
  if (bestTarget.val <= aiCardScore(myWorst)) { closeModalFizzle(); return; }
  G.modal.myUid = myWorst.uid;
  G.modal.theirOwnerId = bestTarget.ownerId;
  G.modal.theirUid = bestTarget.uid;
  confirmSwap();
}

function aiRunSteal(p) {
  const tier = G.modal.stealTier;
  if (G.modal.stealOwnerId == null) {
    const opponents = G.players.filter(pl => pl.id !== p.id && pl.floor.some(c => c.rarity === tier));
    if (opponents.length === 0) { closeModalFizzle(); return; }
    // Take from whoever has the strongest card of that tier.
    const target = opponents.slice().sort((a, b) => {
      const bestOf = pl => Math.max(...pl.floor.filter(c => c.rarity === tier).map(c => c.power));
      return bestOf(b) - bestOf(a);
    })[0];
    chooseStealTarget(target.id);
    return;
  }
  const owner = G.players.find(pl => pl.id === G.modal.stealOwnerId);
  const candidates = owner.floor.filter(c => c.rarity === tier);
  if (!candidates.length) { closeModalFizzle(); return; }
  const best = candidates.slice().sort((a, b) => b.power - a.power)[0];
  confirmSteal(best.uid);
}

// --- Discard-down phase ---

function aiStepDiscard() {
  const pid = G.discardQueue[0];
  const p = G.players.find(pl => pl.id === pid);
  if (!p.isAI) return;
  const need = p.floor.length - 10;
  const worstFirst = p.floor.slice().sort((a, b) => aiCardScore(a) - aiCardScore(b));
  G.discardSelection = worstFirst.slice(0, need).map(c => c.uid);
  confirmDiscard();
}

// --- Attack phase ---

function aiStepAttack() {
  const ui = G.attackUI;
  if (ui.stage === 'bracket') return aiStepBracket();
  if (ui.stage === 'privacy') return aiStepPrivacy();
  if (ui.stage === 'reveal') return aiStepReveal();
  if (ui.stage === 'duel-result') return aiStepDuelResult();
  if (ui.stage === 'match-over') return aiStepMatchOver();
}

function aiStepBracket() {
  const b = G.bracket;
  if (b.finished) { G.attackUI.stage = 'gameover'; render(); return; }
  const m = currentMatch(b);
  if (!m) return;
  if (m.p2 === null) {
    const p1 = G.players.find(pl => pl.id === m.p1);
    if (p1.isAI) resolveByeMatch();
    return;
  }
  const pa = G.players.find(pl => pl.id === m.p1);
  const pb = G.players.find(pl => pl.id === m.p2);
  if (pa.isAI && pb.isAI) startMatchup(m.p1, m.p2);
}

function aiPickFighter(pool) {
  return pool.slice().sort((a, b) =>
    (b.power + b.attack + b.defense + b.specialAttack) - (a.power + a.attack + a.defense + a.specialAttack)
  )[0];
}

function aiStepPrivacy() {
  const pr = G.attackUI.privacy;
  const p = G.players.find(pl => pl.id === pr.forPlayerId);
  if (!p.isAI) return;
  if (!pr.revealed) { revealPick(); return; }
  const m = G.attackUI.matchup;
  const side = (pr.purpose === 'initial-A' || pr.purpose === 'relay-A') ? 'A' : 'B';
  const pool = side === 'A' ? m.poolA : m.poolB;
  const best = aiPickFighter(pool);
  confirmPick(side, best.uid);
}

// Picks an action for an AI-controlled fighter on their turn: leans into their big
// hitters when available, blocks when in danger, and otherwise throws basics.
function aiChooseDuelAction(fighter, opponent) {
  const specialCost = SPECIAL_MANA_COST[fighter.rarity] || 25;
  const canSpecial = canUseSpecial(fighter) && fighter.manaPool >= specialCost;
  const canLegendary = fighter.rarity === 'Legendary' && fighter.ultimateEnergy >= 100 && fighter.manaPool >= LEGENDARY_MANA_COST;
  const lowHp = fighter.hp < fighter.maxHp * 0.25;
  if (lowHp && Math.random() < 0.4) return 'block';
  if (canLegendary && Math.random() < 0.9) return 'legendary';
  if (canSpecial && Math.random() < 0.75) return 'special';
  if (Math.random() < 0.08) return 'block';
  return 'basic';
}

function aiStepReveal() {
  const m = G.attackUI.matchup;
  const pa = G.players.find(pl => pl.id === m.playerAId);
  const pb = G.players.find(pl => pl.id === m.playerBId);
  const turnPlayer = m.turn === 'A' ? pa : pb;
  if (!turnPlayer.isAI) return;
  const fighter = m.turn === 'A' ? m.activeA : m.activeB;
  const opponent = m.turn === 'A' ? m.activeB : m.activeA;
  resolveTurn(m, aiChooseDuelAction(fighter, opponent));
}

function aiStepDuelResult() {
  const state = G.attackUI.lastState;
  const m = G.attackUI.matchup;
  const pa = G.players.find(pl => pl.id === m.playerAId);
  const pb = G.players.find(pl => pl.id === m.playerBId);
  if (state === 'relay-a' && pa.isAI) { beginRelay('A'); return; }
  if (state === 'relay-b' && pb.isAI) { beginRelay('B'); return; }
  if ((state === 'winner-a' || state === 'winner-b') && pa.isAI && pb.isAI) {
    G.attackUI.stage = 'match-over';
    render();
  }
}

function aiStepMatchOver() {
  const m = G.attackUI.matchup;
  const pa = G.players.find(pl => pl.id === m.playerAId);
  const pb = G.players.find(pl => pl.id === m.playerBId);
  if (pa.isAI && pb.isAI) finishMatchup();
}
</script>
<script>
// resolveTurn(m, action) takes a live reference into G, which can't be handed to the
// host as-is from a client (it would arrive as a disconnected copy and mutating it
// wouldn't touch the host's real G). The duel-action buttons call this instead; it
// re-derives the matchup from whichever device's own G is authoritative for it.
function netResolveTurn(action) {
  if (Net.mode === 'client' && Net.inGame) { Net.sendAction('resolveTurn', [action]); return; }
  if (G && G.attackUI && G.attackUI.matchup) resolveTurn(G.attackUI.matchup, action);
}

// Every other player-decision function takes only plain ids/strings, so it can be
// safely intercepted generically: on a client, forward the call (name + args) to the
// host instead of running it locally; on the host (or in local hotseat play), run it
// as normal. The host broadcasts its new state at the end of every render() call, so
// no explicit broadcast is needed here.
const NETWORKED_ACTIONS = [
  'drawCardsForTurn', 'chooseWildcard', 'useHeldWildcard', 'endTurn',
  'selectAuctionCard', 'confirmStartAuction', 'placeBid', 'passAuction',
  'freezePlayerInAuction', 'skipFreeze', 'buyShopCard', 'skipShop', 'revealShop',
  'selectSwapMine', 'selectSwapTheirs', 'confirmSwap', 'chooseStealTarget', 'confirmSteal',
  'toggleDiscardSelect', 'confirmDiscard', 'confirmPick', 'revealPick',
  'beginRelay', 'resolveByeMatch', 'startMatchup', 'finishMatchup', 'resolveCancelPrompt'
];
NETWORKED_ACTIONS.forEach(function (name) {
  const orig = window[name];
  if (typeof orig !== 'function') return;
  window[name] = function (...args) {
    if (Net.mode === 'client' && Net.inGame) { Net.sendAction(name, args); return; }
    return orig.apply(this, args);
  };
});

render();

</script>
